[package]
name = "mcp-md-wiki"
version = "0.1.2"
edition = "2024"
# Keep in lockstep with `channel` in rust-toolchain.toml and `RUST_VERSION`
# in Dockerfile (#235) -- this makes cargo itself refuse a too-old local
# toolchain with a clear "package requires rustc X but Y is installed"
# message, instead of a confusing compile error deep in a build log.
rust-version = "1.89"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Web framework
axum = { version = "0.8", features = ["macros"] }

# MCP server (Streamable HTTP)
rmcp = { version = "1", features = ["transport-streamable-http-server", "server"] }

# Qdrant vector DB (gRPC)
qdrant-client = "1"

# Frontmatter parsing
gray_matter = "0.2"

# Markdown chunking. An upgrade that changes split points must bump
# `ingest::CHUNKER_VERSION`, or the index silently mixes old and new chunks.
text-splitter = { version = "0.18", features = ["markdown"] }

# Heading detection (`heading.rs`): section boundaries, heading text/levels and
# line numbers for chunking and `get_document`'s outline. Same version and
# feature set text-splitter's `markdown` feature already compiles, so this adds
# no new crate to the build. An upgrade that changes heading detection or heading
# text must bump `ingest::CHUNKER_VERSION`, or the index silently mixes old and
# new chunks.
pulldown-cmark = { version = "0.12", default-features = false }
# Unicode case folding for heading comparison (`heading::normalize_heading_text`).
# Already in the build via pulldown-cmark; a folding change must bump
# `ingest::CHUNKER_VERSION` for the same reason as above.
unicase = "2.9"

# Embeddings API (OpenAI-compatible)
async-openai = "0.27"

# Config
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
serde_json = "1"

# JSON Schema generation for MCP-facing types that live outside src/mcp.rs (e.g.
# schema.rs's RawFieldDef, advertised as the `update_schema` `definition` parameter).
# Pinned to the same major version rmcp pulls in via its own `schemars` re-export, so
# both refer to the same JsonSchema trait rather than two incompatible copies.
schemars = "1"

# SQLite state DB
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Glob patterns
globset = "0.4"

# Hashing
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
subtle = "2"

# UUID
uuid = { version = "1", features = ["v5"] }

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Retry with exponential backoff
backoff = { version = "0.4", features = ["tokio"] }

# Rate limiting
tower_governor = "0.8"

# `RequestBodyLimitLayer`: the `/mcp` body cap has to be enforced this way rather
# than via `axum::extract::DefaultBodyLimit`, because rmcp's `StreamableHttpService`
# reads the request body itself (`Body::collect()`) without going through an axum
# body extractor — the marker `DefaultBodyLimit` inserts into request extensions is
# never consulted, so that layer alone is a no-op for `/mcp` (#205). This layer wraps
# the body itself, so it applies regardless of how the inner service reads it. Already
# present transitively (via axum/rmcp); pulled in directly here because we now depend
# on its API, not just its presence in the tree.
tower-http = { version = "0.6", default-features = false, features = ["limit"] }

# Misc
anyhow = "1"
thiserror = "2"
tokio-util = "0.7"

# Text diffing (unified diff output for write tool results)
similar = "2"

# Bounded-concurrency stream combinators (e.g. `buffer_unordered`) for fanning out
# independent async work — subprocess validation, DB lookups — without spawning
# unbounded tasks.
futures = "0.3"

# Date/time parsing for mtime range filters and CLI date flags
chrono = { version = "0.4", default-features = false, features = ["std"] }
# OAuth 2.1 resource server (mcp-md-wiki#308): JWT access-token validation against a
# JWKS, RFC 9728 metadata, the `WWW-Authenticate` challenges, the static-token policy,
# and the axum middleware + well-known routes `server.rs` mounts. Published to
# crates.io: https://crates.io/crates/oauth-resource-server.
#
# `native-tls`, not the crate's default `rustls-tls`: this binary's own `reqwest`
# (above) enables `default-tls`, so reqwest's default backend — the one the JWKS
# client uses — stays native-tls, as before the extraction, and this dependency
# adds no TLS stack of its own. That is not "rustls is absent": async-openai
# (`rustls` default feature), qdrant-client (`reqwest/rustls-tls`) and tonic
# (tokio-rustls) already pull rustls 0.23 into the tree.
oauth-resource-server = { version = "0.4", default-features = false, features = ["native-tls", "serde", "axum", "env"] }

[dev-dependencies]
# Throwaway keys, token minting and a fake JWKS server for `server.rs`'s auth tests.
# Test-only by construction: the private keys it ships are public knowledge.
oauth-resource-server = { version = "0.4", default-features = false, features = ["native-tls", "serde", "axum", "env", "testing"] }
tempfile = "3"
tower = "0.5"
# Only for tests: `#[tokio::test(start_paused = true)]` lets reindex.rs's retry/backoff
# tests fast-forward through real `tokio::time::sleep` calls (backoff runs to several
# minutes of wall-clock time at MAX_RETRY_ATTEMPTS) instead of actually waiting.
tokio = { version = "1", features = ["test-util"] }
