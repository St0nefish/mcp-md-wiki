name: Build image

# Builds, smoke-tests and tags ONE tree's image as `:tree-<tree hash>` (an image index
# holding linux/amd64 only — the deployment runs on x86; adding a platform is one more
# `build` matrix entry, plus its arch in `BUILD_ARCHES` below and in release.yml's binary
# extraction). Callers:
#   - slow.yml, on the merge of an armed PR's head onto the pinned master (merge mode).
#     Named after the tree, not a commit: the merge commit does not exist until GitHub
#     merges the PR, and its tree is this one. master.yml then adds `:sha-<commit>`.
#   - master.yml, on a merge commit (ref mode): reuses the tree's image when ci-slow built
#     it, or builds it after the fallback tests passed.
#
# The build is pushed by digest, joined into an index under a staging tag
# (`:build-tree-<tree>`, nothing reads it) and gets `:tree-<tree>` only after the smoke
# test passes, so a build that fails, or fails its smoke test, never carries the tag
# anything resolves. When `:tree-<tree>` already exists nothing is rebuilt and the
# existing digest is the output: tags are immutable here, and an image that carries one
# was smoke-tested.
#
# Labels: org.opencontainers.image.revision = the tree hash (release.yml checks it),
# org.opencontainers.image.version = Cargo.toml's version in that tree. Nothing here
# touches :sha-, :dev, :latest or Watchtower.
#
# Every pipeline script runs as the caller's (master's) copy, kept aside before the merge:
# the PR's code is built and run, but never its scripts with registry credentials in reach.

on:
  workflow_call:
    inputs:
      ref:
        description: "Ref mode: commit to build"
        type: string
        required: false
        default: ""
      base-sha:
        description: "Merge mode: the pinned master commit"
        type: string
        required: false
        default: ""
      head-sha:
        description: "Merge mode: the pinned PR head"
        type: string
        required: false
        default: ""
      tree:
        description: "The tree being built; a job whose checkout differs fails"
        type: string
        required: true
    outputs:
      image:
        description: "ghcr.io/<owner>/<repo>, lowercased"
        value: ${{ jobs.prepare.outputs.image }}
      digest:
        description: "Image-index digest that carries `:tree-<tree>`"
        value: ${{ jobs.merge.outputs.digest || jobs.prepare.outputs.existing_digest }}

permissions:
  contents: read

jobs:
  # Decides whether to build at all, before any runner spends time on a compile.
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      image: ${{ steps.image.outputs.name }}
      rust_version: ${{ steps.rust_version.outputs.version }}
      version: ${{ steps.version.outputs.version }}
      exists: ${{ steps.existing.outputs.exists }}
      existing_digest: ${{ steps.existing.outputs.digest }}
    steps:
      - name: Require exactly one of merge mode and ref mode
        env:
          REF: ${{ inputs.ref }}
          BASE_SHA: ${{ inputs.base-sha }}
          HEAD_SHA: ${{ inputs.head-sha }}
          TREE: ${{ inputs.tree }}
        run: |
          if [[ ! "$TREE" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::tree must be a full tree hash, got '${TREE}'"
            exit 1
          fi
          if [[ -n "$BASE_SHA" && -n "$HEAD_SHA" && -z "$REF" ]]; then
            echo "merge mode: ${HEAD_SHA} onto ${BASE_SHA}, tree ${TREE}"
          elif [[ -n "$REF" && -z "$BASE_SHA$HEAD_SHA" ]]; then
            echo "ref mode: ${REF}, tree ${TREE}"
          else
            echo "::error::pass either base-sha + head-sha, or ref"
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.base-sha || inputs.ref }}
          fetch-depth: 0
          # merge-tree.sh may fetch the PR head, then drops the credentials.
          persist-credentials: ${{ inputs.head-sha != '' }}

      # The caller's (master's) copy, before the merge can rewrite the checkout.
      - name: Keep the pipeline scripts aside
        run: rm -rf "${RUNNER_TEMP}/ci-scripts" && cp -R .github/scripts "${RUNNER_TEMP}/ci-scripts"

      - name: Merge the PR onto the pinned master
        if: inputs.head-sha != ''
        env:
          BASE_SHA: ${{ inputs.base-sha }}
          HEAD_SHA: ${{ inputs.head-sha }}
          TREE: ${{ inputs.tree }}
        run: '"${RUNNER_TEMP}/ci-scripts/merge-tree.sh" "$BASE_SHA" "$HEAD_SHA" "$TREE"'

      - name: Require the expected tree
        env:
          TREE: ${{ inputs.tree }}
        run: |
          got=$(git rev-parse 'HEAD^{tree}')
          [[ "$got" == "$TREE" ]] || { echo "::error::checkout tree ${got}, expected ${TREE}"; exit 1; }

      # The toolchain pin and the version label come from the tree being built.
      - name: Read pinned Rust toolchain version
        id: rust_version
        run: '"${RUNNER_TEMP}/ci-scripts/rust-version.sh"'

      - name: Read the version label
        id: version
        run: |
          version=$(awk '
            /^\[/ { in_package = ($0 == "[package]") }
            in_package && /^version *=/ { sub(/^version *= *"/, ""); sub(/".*$/, ""); print; exit }
          ' Cargo.toml)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::could not read a valid [package] version from Cargo.toml (got '${version}')"
            exit 1
          fi
          echo "version=${version}" | tee -a "$GITHUB_OUTPUT"

      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A registry error is not "not found" — fail rather than rebuild over a tag that
      # might exist.
      - name: Reuse an existing build of this tree
        id: existing
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          TREE: ${{ inputs.tree }}
        run: |
          digest=$("${RUNNER_TEMP}/ci-scripts/image-digest.sh" "${IMAGE}:tree-${TREE}")
          if [[ -n "$digest" ]]; then
            echo "${IMAGE}:tree-${TREE} already exists (${digest}); not rebuilding."
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  # One native build per architecture (amd64 only, on the self-hosted runners; a native
  # arm64 build would use GitHub's hosted `ubuntu-24.04-arm` runner, never QEMU). Each
  # pushes its image by digest only — no tag — and hands the digest to `merge`, which is
  # the only job that names anything.
  build:
    needs: [prepare]
    if: needs.prepare.outputs.exists == 'false'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      # One architecture failing means no index can be made, so stop the other early.
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: self-hosted
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.base-sha || inputs.ref }}
          fetch-depth: 0
          # merge-tree.sh may fetch the PR head, then drops the credentials.
          persist-credentials: ${{ inputs.head-sha != '' }}

      - name: Keep the pipeline scripts aside
        run: rm -rf "${RUNNER_TEMP}/ci-scripts" && cp -R .github/scripts "${RUNNER_TEMP}/ci-scripts"

      - name: Merge the PR onto the pinned master
        if: inputs.head-sha != ''
        env:
          BASE_SHA: ${{ inputs.base-sha }}
          HEAD_SHA: ${{ inputs.head-sha }}
          TREE: ${{ inputs.tree }}
        run: '"${RUNNER_TEMP}/ci-scripts/merge-tree.sh" "$BASE_SHA" "$HEAD_SHA" "$TREE"'

      - name: Require the expected tree
        env:
          TREE: ${{ inputs.tree }}
        run: |
          got=$(git rev-parse 'HEAD^{tree}')
          [[ "$got" == "$TREE" ]] || { echo "::error::checkout tree ${got}, expected ${TREE}"; exit 1; }

      # A docker-container builder: the default docker driver can neither push by
      # digest nor export a registry cache.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # VERSION/REVISION feed the Dockerfile's OCI labels. provenance: false keeps each
      # per-arch push a single image manifest, so the index `merge` builds holds exactly
      # the platform images and no unknown/unknown attestation entries. The layer cache
      # is per architecture: builds for different platforms share no layers, and one ref
      # would have them overwrite each other's cache on every run. `context: .` builds the
      # checked out working tree — the merge, in merge mode — not a fresh git fetch.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            RUST_VERSION=${{ needs.prepare.outputs.rust_version }}
            VERSION=${{ needs.prepare.outputs.version }}
            REVISION=${{ inputs.tree }}
          provenance: false
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-${{ matrix.arch }},mode=max

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::build produced no usable digest: '${DIGEST}'"
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Joins the per-arch digests into one image index, smoke-tests it, and only then gives
  # it `:tree-<tree>`. Self-hosted, because that is an amd64 host with Docker where the
  # smoke test can run the image (it pulls the amd64 entry of the index).
  merge:
    needs: [prepare, build]
    runs-on: self-hosted
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.index.outputs.digest }}
    steps:
      # The Qdrant pin the smoke test reads (docker-compose.yml) comes from the tree under
      # test; the smoke test script itself is master's copy.
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.base-sha || inputs.ref }}
          fetch-depth: 0
          # merge-tree.sh may fetch the PR head, then drops the credentials.
          persist-credentials: ${{ inputs.head-sha != '' }}

      - name: Keep the pipeline scripts aside
        run: rm -rf "${RUNNER_TEMP}/ci-scripts" && cp -R .github/scripts "${RUNNER_TEMP}/ci-scripts"

      - name: Merge the PR onto the pinned master
        if: inputs.head-sha != ''
        env:
          BASE_SHA: ${{ inputs.base-sha }}
          HEAD_SHA: ${{ inputs.head-sha }}
          TREE: ${{ inputs.tree }}
        run: '"${RUNNER_TEMP}/ci-scripts/merge-tree.sh" "$BASE_SHA" "$HEAD_SHA" "$TREE"'

      - name: Require the expected tree
        env:
          TREE: ${{ inputs.tree }}
        run: |
          got=$(git rev-parse 'HEAD^{tree}')
          [[ "$got" == "$TREE" ]] || { echo "::error::checkout tree ${got}, expected ${TREE}"; exit 1; }

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed under the staging tag only; nothing reads build- tags.
      - name: Create the image index
        id: index
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          TAG: tree-${{ inputs.tree }}
          # Must match the `build` matrix.
          BUILD_ARCHES: amd64
        run: |
          refs=()
          for f in "${RUNNER_TEMP}"/digests/*; do
            refs+=("${IMAGE}@sha256:$(basename "$f")")
          done
          read -ra want <<<"$BUILD_ARCHES"
          if [ "${#refs[@]}" -ne "${#want[@]}" ]; then
            echo "::error::expected ${#want[@]} per-arch digests (${BUILD_ARCHES}), got ${#refs[@]}: ${refs[*]}"
            exit 1
          fi
          docker buildx imagetools create --tag "${IMAGE}:build-${TAG}" "${refs[@]}"
          digest=$(docker buildx imagetools inspect "${IMAGE}:build-${TAG}" --format '{{json .Manifest}}' | jq -r '.digest')
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::${IMAGE}:build-${TAG} resolved to no usable digest: '${digest}'"
            exit 1
          fi
          echo "${IMAGE}:build-${TAG} -> ${digest}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Smoke test the build
        env:
          REF: ${{ needs.prepare.outputs.image }}@${{ steps.index.outputs.digest }}
        run: '"${RUNNER_TEMP}/ci-scripts/smoke-test-image.sh" "$REF"'

      # Only now does the build get the tag anything reads. The source is a single image
      # index with no annotations, which `imagetools create` copies verbatim, so the tag
      # names the smoke-tested index digest rather than a new index. The digest check
      # proves it rather than trusting it.
      - name: Tag the tested build
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          DIGEST: ${{ steps.index.outputs.digest }}
          TAG: tree-${{ inputs.tree }}
        run: |
          docker buildx imagetools create --tag "${IMAGE}:${TAG}" "${IMAGE}@${DIGEST}"
          got=$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{json .Manifest}}' | jq -r '.digest')
          if [ "${got}" != "${DIGEST}" ]; then
            echo "::error::${IMAGE}:${TAG} is ${got} after the retag, expected ${DIGEST}."
            exit 1
          fi
          echo "${IMAGE}:${TAG} -> ${DIGEST}" | tee -a "$GITHUB_STEP_SUMMARY"
