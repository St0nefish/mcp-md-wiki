name: Checks

# The one definition of what "this tree passes" means. Callers:
#   - ci-fast.yml: the fast tier (lint + test) on GitHub's test merge of a PR.
#   - slow.yml: the slow tier (`qdrant-integration`, live Qdrant) on the merge of an armed
#     PR's head onto the pinned master; it posts the required `ci-slow` status.
#   - master.yml's fallback: both tiers on a merge commit whose tree nothing tested.
# Keeping the steps here means the gate and the fallback cannot drift apart.
#
# Two ways to say what to check:
#   - merge mode (base-sha + head-sha + expected-tree): every job rebuilds the merge with
#     .github/scripts/merge-tree.sh (master's copy) and refuses to run unless its tree is
#     the one slow.yml pinned, so jobs on different runners test the same tree without
#     passing it around as an artifact;
#   - ref mode (ref, or nothing for the caller's own ref): a plain checkout.
#
# The jobs are independent and run in parallel, each on its own runner container, so
# the wall clock is the slowest job rather than the sum.
#
# A called workflow sees the CALLER's `github` context, so commits are passed as inputs;
# a missing input fails loudly rather than checking out an empty ref. No `concurrency`
# here on purpose: each caller owns its own group.

on:
  workflow_call:
    inputs:
      ref:
        description: "Ref mode: commit to check out (default: the caller's own ref)"
        type: string
        required: false
        default: ""
      base-sha:
        description: "Merge mode: the pinned master commit"
        type: string
        required: false
        default: ""
      head-sha:
        description: "Merge mode: the pinned PR head"
        type: string
        required: false
        default: ""
      expected-tree:
        description: "Merge mode: the tree of the merge; a job whose merge differs fails"
        type: string
        required: false
        default: ""
      fast:
        description: "Run the fast tier: lint (fmt, clippy, audit, deny) and unit tests"
        type: boolean
        required: false
        default: true
      integration:
        description: "Run the live-Qdrant integration suite"
        type: boolean
        required: false
        default: true
      runner:
        description: "Runner for lint and test (qdrant-integration is always self-hosted); ci-fast.yml passes ubuntu-latest for anyone but the owner"
        type: string
        required: false
        default: self-hosted

permissions:
  contents: read

# CARGO_INCREMENTAL=0: incremental artifacts are useless in CI (every build starts from
# a restored cache, never from a previous edit) and roughly double target/, which is
# what the cache stores and restores. line-tables-only keeps backtraces usable while
# dropping most of the debug info, shrinking target/ and link time again.
# rust-cache hashes CARGO_* / RUST* env into its key, so these are set once, here, for
# every job and every caller, or a PR's restore would miss master's save.
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_TERM_COLOR: always

jobs:
  lint:
    if: inputs.fast
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      # Merge mode checks out the pinned master commit, so the merge script that runs
      # next is master's copy, not one the PR could have edited.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.base-sha || inputs.ref }}
          fetch-depth: 0
          # merge-tree.sh may fetch the PR head, then drops the credentials.
          persist-credentials: ${{ inputs.expected-tree != '' }}

      - name: Merge the PR onto the pinned master
        if: inputs.expected-tree != ''
        env:
          BASE_SHA: ${{ inputs.base-sha }}
          HEAD_SHA: ${{ inputs.head-sha }}
          EXPECTED_TREE: ${{ inputs.expected-tree }}
        run: .github/scripts/merge-tree.sh "$BASE_SHA" "$HEAD_SHA" "$EXPECTED_TREE"

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev

      - name: Read pinned Rust toolchain version
        id: rust_version
        run: .github/scripts/rust-version.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust_version.outputs.version }}
          components: clippy, rustfmt

      # Keyed per job: clippy's check-metadata artifacts share nothing useful with the
      # test profile's, so lint and the test jobs keep separate caches instead of
      # overwriting each other. Saved only from master: GitHub scopes a cache to the
      # ref that saved it, and a PR can restore caches saved on its base branch but
      # never another PR's, so a PR-saved cache is quota spent on something no other
      # run can read, and it evicts master's. Runs on master's ref save (master.yml's
      # fallback; slow.yml, dispatched on master even though it checks a merge); ci-fast,
      # on the PR's ref, only restores.
      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        # --all-targets lints test code too, matching .githooks/pre-commit. Without
        # it, lint failures confined to #[cfg(test)] code sail past both the
        # (opt-in) hook and CI (fix #196).
        run: cargo clippy --all-targets -- -D warnings

      # Both the bootstrap script (fetched at a commit, not `main`) and the cargo-binstall
      # release it installs (BINSTALL_VERSION, read by the script) are pinned, as are the two
      # tools below, so a run never picks up a moving target. Bump them together by hand
      # (dependabot does not see these).
      - name: Install cargo-binstall
        env:
          # Commit of tag v1.26.2 in cargo-bins/cargo-binstall.
          BINSTALL_SCRIPT_COMMIT: 851112458b5f28a29e5bc14a690c3f283d9dcc6f
          BINSTALL_VERSION: v1.26.2
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf \
            "https://raw.githubusercontent.com/cargo-bins/cargo-binstall/${BINSTALL_SCRIPT_COMMIT}/install-from-binstall-release.sh" | bash

      - name: Install cargo-audit and cargo-deny
        env:
          CARGO_AUDIT_VERSION: 0.22.2
          CARGO_DENY_VERSION: 0.20.2
        run: |
          # --force when the binary is missing: on a persistent self-hosted runner,
          # cargo-binstall's install record (CARGO_HOME/.crates2.json) can survive the
          # binary itself, and it then reports "already installed" without one.
          install_tool() {
            local crate="$1" version="$2"
            if command -v "$crate" >/dev/null; then
              cargo binstall "${crate}@${version}" --no-confirm --locked
            else
              cargo binstall "${crate}@${version}" --no-confirm --locked --force
            fi
          }
          install_tool cargo-audit "$CARGO_AUDIT_VERSION"
          install_tool cargo-deny "$CARGO_DENY_VERSION"

      - name: Audit dependencies
        run: cargo audit

      # Licenses, banned/duplicate crates and sources, plus the advisory check again with
      # deny.toml's reasoned ignores. Configuration and policy: deny.toml.
      - name: Check dependency policy
        run: cargo deny check

  test:
    if: inputs.fast
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.base-sha || inputs.ref }}
          fetch-depth: 0
          # merge-tree.sh may fetch the PR head, then drops the credentials.
          persist-credentials: ${{ inputs.expected-tree != '' }}

      # See the lint job.
      - name: Merge the PR onto the pinned master
        if: inputs.expected-tree != ''
        env:
          BASE_SHA: ${{ inputs.base-sha }}
          HEAD_SHA: ${{ inputs.head-sha }}
          EXPECTED_TREE: ${{ inputs.expected-tree }}
        run: .github/scripts/merge-tree.sh "$BASE_SHA" "$HEAD_SHA" "$EXPECTED_TREE"

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev

      - name: Read pinned Rust toolchain version
        id: rust_version
        run: .github/scripts/rust-version.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust_version.outputs.version }}

      # `cargo test` here and `cargo test -- --ignored` in qdrant-integration compile
      # exactly the same test-profile artifacts, so they share one cache key. This job
      # is the one that saves it (master only — see the lint job's cache step);
      # qdrant-integration only restores, so the two never race to save one key.
      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Run tests
        run: cargo test

  # The mocked VectorStore suite proves nothing about real Qdrant wire
  # semantics — filters, phrase matching, RRF, recommend. The eight tests that
  # do exercise a live server (src/qdrant.rs) are #[ignore]d, and plain
  # `cargo test` (above) never passes --ignored, so none of them ran in CI
  # before this job was added (#186, and its narrower instance #133). Start a
  # qdrant container (image pin single-sourced from docker-compose.yml, but
  # NOT the compose service itself — see `Start Qdrant` for why) and run just
  # those.
  qdrant-integration:
    if: inputs.integration
    # Always self-hosted, whatever `runner` says: the job needs a Docker daemon
    # (host socket or dind sidecar) to start Qdrant on.
    runs-on: self-hosted
    timeout-minutes: 30
    # Blocking as of #133. Three separate things had to be true first, and all
    # three now are:
    #  1. Two pre-existing bugs in the tests themselves — an invalid literal
    #     point-ID UUID in phrase_index_enables_exact_phrase_matching's fixture
    #     (fixed by #212) and a genuine assertion mismatch in
    #     recommend_by_point_id_finds_nearest_neighbor (fixed by #231, which
    #     also made the suite safe under cargo's default multi-threaded
    #     harness rather than --test-threads=1). Both closed.
    #  2. The job could never reach qdrant at all: it published ports onto the
    #     host's loopback from a runner that is itself a container. Fixed in
    #     `Start Qdrant` below — see that step's comment.
    #  3. An actual green run. This job had 0 successes in 52 attempts before
    #     that fix; run 33342483836 is the first, with `Run live-Qdrant tests`
    #     reporting "7 passed; 0 failed". It is required from that point on,
    #     not on the strength of local runs.
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.base-sha || inputs.ref }}
          fetch-depth: 0
          # merge-tree.sh may fetch the PR head, then drops the credentials.
          persist-credentials: ${{ inputs.expected-tree != '' }}

      # See the lint job.
      - name: Merge the PR onto the pinned master
        if: inputs.expected-tree != ''
        env:
          BASE_SHA: ${{ inputs.base-sha }}
          HEAD_SHA: ${{ inputs.head-sha }}
          EXPECTED_TREE: ${{ inputs.expected-tree }}
        run: .github/scripts/merge-tree.sh "$BASE_SHA" "$HEAD_SHA" "$EXPECTED_TREE"

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev

      - name: Read pinned Rust toolchain version
        # Same pin as the other two jobs (#235), so this job's `cargo test`
        # can't end up on a different toolchain than the one `test` compiled
        # and `lint` linted against.
        id: rust_version
        run: .github/scripts/rust-version.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust_version.outputs.version }}

      # Restores the `test` job's cache (same artifacts); never saves — see there.
      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: false

      - name: Start Qdrant
        run: |
          # Publish Qdrant's ports on random free host ports and reach them via the
          # Docker daemon's host (see `Wait for Qdrant to be ready`). Never share the
          # runner's network namespace or assume a particular daemon layout: the
          # daemon may be the host's socket or a dind sidecar, and published ports
          # land on whichever host runs the daemon.
          #
          # The container name must be unique per run, not a fixed string: several
          # self-hosted runners can share one Docker daemon, so a hardcoded
          # `ci-qdrant` means PR-B's startup `docker rm -f` destroys the server PR-A
          # is mid-`cargo test` against -- failing PR-A's required check for a fault
          # it did not cause. Export the name so the `Stop Qdrant` step (a separate
          # step, with its own shell) removes the same container this one created.
          name="ci-mcp-md-wiki-${GITHUB_JOB}-qdrant-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "CI_QDRANT_NAME=${name}" >> "$GITHUB_ENV"
          docker rm -f "$name" 2>/dev/null || true
          # Image stays single-sourced from docker-compose.yml so the pin
          # can't drift from what the deployment runs.
          image=$(docker compose -f docker-compose.yml config --images qdrant)
          docker run -d --name "$name" \
            --label ci.repo=mcp-md-wiki --label "ci.job=${GITHUB_JOB}" --label "ci.run=${GITHUB_RUN_ID}" \
            -p 6333 -p 6334 "$image"

      - name: Wait for Qdrant to be ready
        run: |
          # Host the published ports are reachable on: the host of a tcp:// DOCKER_HOST
          # (a dind sidecar); otherwise the local daemon, whose ports are reachable
          # on loopback or, from a runner container, on the default gateway.
          rest_port=$(docker port "$CI_QDRANT_NAME" 6333/tcp | head -n1 | sed 's/.*://')
          grpc_port=$(docker port "$CI_QDRANT_NAME" 6334/tcp | head -n1 | sed 's/.*://')
          candidates=()
          if [[ "${DOCKER_HOST:-}" == tcp://* ]]; then
            h=${DOCKER_HOST#tcp://}; h=${h%%/*}; h=${h%:*}
            candidates+=("${h#[}")
          else
            candidates+=(127.0.0.1)
            gw=$(ip route show default 2>/dev/null | awk '{print $3; exit}' || true)
            [[ -n "$gw" ]] && candidates+=("$gw")
          fi
          timeout=60
          elapsed=0
          host=""
          while [[ -z "$host" ]]; do
            for c in "${candidates[@]}"; do
              code=$(curl -s -o /dev/null -w '%{http_code}' "http://${c}:${rest_port}/readyz" || echo "000")
              if [[ "$code" == "200" ]]; then host=$c; break; fi
            done
            [[ -n "$host" ]] && break
            if (( elapsed >= timeout )); then
              echo "::error::qdrant did not become ready within ${timeout}s on ${candidates[*]} (last HTTP status: ${code})"
              docker logs "$CI_QDRANT_NAME"
              exit 1
            fi
            sleep 2
            elapsed=$((elapsed + 2))
          done
          echo "qdrant ready at ${host} (rest ${rest_port}, grpc ${grpc_port})"
          # QDRANT_URL is the app's own setting (src/config.rs), a gRPC endpoint like
          # the deployment's :6334, so both point at the gRPC port.
          echo "QDRANT_URL=http://${host}:${grpc_port}" >> "$GITHUB_ENV"
          echo "QDRANT_GRPC_URL=http://${host}:${grpc_port}" >> "$GITHUB_ENV"

      - name: Run live-Qdrant tests
        run: cargo test -- --ignored

      - name: Stop Qdrant
        if: always()
        # Only ever removes THIS runner's own container (see `Start Qdrant`),
        # never another concurrent PR's. `if: always()` means this can run when
        # `Start Qdrant` failed before exporting the name, so guard on it being
        # set — an unguarded `docker rm -f ""` would just be noise.
        run: |
          if [[ -n "${CI_QDRANT_NAME:-}" ]]; then
            docker rm -f "$CI_QDRANT_NAME" 2>/dev/null || true
          fi
