name: Release

# A release is the owner's act, never a side effect of a merge or a version change:
#   gh release create vX.Y.Z --target <full master sha> --title vX.Y.Z --notes ""
# X.Y.Z is Cargo.toml's version at that commit (on master, always the NEXT release). Pass
# the full sha: `master` as a target would carry along any PR merged in the meantime. An
# empty body gets CHANGELOG.md's [Unreleased] section as the notes (`notes`); a body the
# owner wrote, or `--generate-notes`, is kept.
#
# Runs from the TAGGED commit's copy of this file and its scripts. It never builds: it
# promotes the image master.yml attached to the commit (`:sha-<commit>`).
#
#   check     read-only, fails closed unless: the sender is in RELEASE_SENDERS; not a
#             draft or prerelease; the tag is vX.Y.Z == Cargo.toml's version at the
#             tagged commit, which is this run's commit and on master; the tag is the
#             highest stable v* tag; CHANGELOG.md's [Unreleased] section is non-empty;
#             `:sha-<commit>` exists; the commit carries master.yml's `verified` status.
#             A docs-only commit has both by inheriting its parent's; a version-only
#             commit (the roll PR, a hand bump) has neither, so releasing it fails —
#             there is nothing new to release.
#   image     (environment `release`) smoke-test the pinned digest, re-check highest-tag,
#             retag it :vX.Y.Z + :latest (same digest), read back
#   binaries  (environment `release`) mcp-md-wiki-linux-amd64 copied out of the tested
#             image + SHA256SUMS, uploaded to the release
#   notes     an empty release body gets CHANGELOG.md's [Unreleased] section (or
#             GitHub's generated notes, if that is empty)
#   deploy    (environment `release`, holds WATCHTOWER_ATLAS_TOKEN) Watchtower on atlas
#             pulls the new :latest
#   arm64     dispatches arm64-image.yml for the released commit (a separate run)
#   roll      as the App: open and arm the PR moving master's version to the next patch,
#             unless master's version already moved
#
# Recovery: a transient failure -> `gh run rerun <id> --failed` (every job is idempotent).
# A broken commit: as the owner `gh release delete vX.Y.Z --cleanup-tag`, merge the fix
# (master still holds X.Y.Z, since `roll` runs only after everything shipped), release
# again.

on:
  release:
    types: [published]

# One run per tag, never cancelled.
concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Logins whose published release may ship (space-separated). The owner only: no bot
  # creates releases.
  RELEASE_SENDERS: "St0nefish"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      statuses: read
      actions: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - name: Require a stable, non-draft release from an allowed sender
        env:
          SENDER: ${{ github.event.sender.login }}
          DRAFT: ${{ github.event.release.draft }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          allowed=false
          for s in ${RELEASE_SENDERS}; do
            if [[ -n "$SENDER" && "$SENDER" == "$s" ]]; then allowed=true; fi
          done
          if [[ "$allowed" != true ]]; then
            echo "::error::this release was published by '${SENDER}', not one of: ${RELEASE_SENDERS}."
            exit 1
          fi
          if [[ "$DRAFT" != false || "$PRERELEASE" != false ]]; then
            echo "::error::draft/prerelease releases are not shipped (draft=${DRAFT}, prerelease=${PRERELEASE})."
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release tag '${TAG}' is not vX.Y.Z."
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/tags/${TAG}" ]]; then
            echo "::error::GITHUB_REF is ${GITHUB_REF}, expected refs/tags/${TAG}"
            exit 1
          fi

      # Credentials persisted (read-only token): the guards below fetch and `git ls-remote`.
      - name: Checkout the tagged commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Read the version at the tagged commit
        id: meta
        run: |
          version=$(awk '
            /^\[/ { in_package = ($0 == "[package]") }
            in_package && /^version *=/ { sub(/^version *= *"/, ""); sub(/".*$/, ""); print; exit }
          ' Cargo.toml)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::could not read a valid [package] version from Cargo.toml (got '${version}')"
            exit 1
          fi
          {
            echo "version=${version}"
            echo "tag=v${version}"
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Require tag == Cargo.toml version
        env:
          TAG: ${{ github.event.release.tag_name }}
          CARGO_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if [[ "$TAG" != "$CARGO_TAG" ]]; then
            echo "::error::release tag ${TAG} does not match Cargo.toml's version (${CARGO_TAG}) at ${GITHUB_SHA}."
            exit 1
          fi
          echo "${TAG} == Cargo.toml's version at ${GITHUB_SHA}"

      - name: Require the tag at this run's commit, on master
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          git fetch --quiet --no-tags origin "+refs/tags/${TAG}:refs/tags/${TAG}" "+refs/heads/master:refs/remotes/origin/master"
          tag_commit=$(git rev-parse "refs/tags/${TAG}^{commit}")
          if [[ "$tag_commit" != "$GITHUB_SHA" || "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "::error::tag ${TAG} is at ${tag_commit}, the checkout at $(git rev-parse HEAD), the event names ${GITHUB_SHA}."
            exit 1
          fi
          status=0
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master || status=$?
          case "$status" in
            0) echo "${GITHUB_SHA} is on master" ;;
            1) echo "::error::${GITHUB_SHA} is not on master. Release only a merged commit."; exit 1 ;;
            *) echo "::error::git merge-base failed (exit ${status})."; exit 1 ;;
          esac

      - name: Require the highest stable release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: .github/scripts/require-highest-tag.sh "$TAG"

      # It becomes the notes (an empty body) and the dated section the roll PR adds.
      - name: Require a non-empty [Unreleased] section
        run: .github/scripts/changelog-section.sh Unreleased CHANGELOG.md

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Require the tested image (:sha-<commit>)
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          digest=$(.github/scripts/wait-image.sh "$IMAGE" "$GITHUB_SHA")
          if [[ -z "$digest" ]]; then
            echo "::error::no ${IMAGE}:sha-${GITHUB_SHA}: nothing tested to promote. A version-only commit (the roll PR, a hand bump) has none; release a commit with a build."
            exit 1
          fi
          # The revision label: the tree hash the image was built from (build-image.yml).
          # Both platform images of an index carry the same labels; read amd64's.
          revision=$(docker buildx imagetools inspect "${IMAGE}@${digest}" --format '{{json .Image}}' |
            jq -r 'if has("linux/amd64") then .["linux/amd64"] else . end
                   | .config.Labels["org.opencontainers.image.revision"] // empty')
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::${IMAGE}@${digest} has no revision label"; exit 1; }
          echo "${IMAGE}:sha-${GITHUB_SHA} -> ${digest} (built from tree ${revision})"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Require the verified status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # shellcheck source=/dev/null
          . .github/scripts/status-lib.sh
          deadline=$((SECONDS + 1200))
          while :; do
            st=$(latest_status "$GITHUB_SHA" verified)
            if [[ "$st" == success* ]]; then
              echo "verified: ${st#success }"
              exit 0
            fi
            running=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow master.yml --commit "$GITHUB_SHA" \
              --json status --jq '[.[] | select(.status != "completed")] | length')
            if [[ "$running" == 0 || $SECONDS -ge $deadline ]]; then
              echo "::error::${GITHUB_SHA} has no 'verified' success (${st:-no status}): its tree was never proven tested."
              exit 1
            fi
            sleep 20
          done

  image:
    needs: [check]
    # An amd64 host with Docker where the smoke test can run the image.
    runs-on: self-hosted
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      packages: write
    outputs:
      digest_changed: ${{ steps.promote.outputs.digest_changed }}
    env:
      IMAGE: ${{ needs.check.outputs.image }}
      TAG: ${{ needs.check.outputs.tag }}
      DIGEST: ${{ needs.check.outputs.digest }}
    steps:
      # Credentials persisted (read-only token): the highest-tag guard runs `git ls-remote`.
      # The smoke test script and the Qdrant pin it reads, as of the released commit.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke test the image being promoted
        run: .github/scripts/smoke-test-image.sh "${IMAGE}@${DIGEST}"

      # Immediately before the retag, so a release published meanwhile is seen. A run this
      # guard stops stays failed; to ship a fix on top of a newer release, release it as a
      # new, higher version.
      - name: Refuse to move :latest backwards
        run: .github/scripts/require-highest-tag.sh "$TAG"

      # No rebuild, no layer push: the source is the tested image index, copied verbatim,
      # so the new tags carry the :sha- digest. Verified below rather than trusted.
      - name: Promote to :vX.Y.Z and :latest
        id: promote
        run: |
          current=$(.github/scripts/image-digest.sh "${IMAGE}:sha-${GITHUB_SHA}")
          [[ "$current" == "$DIGEST" ]] || { echo "::error::${IMAGE}:sha-${GITHUB_SHA} is '${current}', not ${DIGEST}"; exit 1; }
          # What :latest names now: a re-run re-applies the digest :latest already carries,
          # and then Watchtower correctly updates nothing (deploy reads this).
          prev=$(.github/scripts/image-digest.sh "${IMAGE}:latest")
          docker buildx imagetools create --tag "${IMAGE}:${TAG}" --tag "${IMAGE}:latest" "${IMAGE}@${DIGEST}"
          for t in "$TAG" latest "sha-${GITHUB_SHA}"; do
            got=$(.github/scripts/image-digest.sh "${IMAGE}:${t}")
            [[ "$got" == "$DIGEST" ]] || { echo "::error::${IMAGE}:${t} is '${got}', expected ${DIGEST}"; exit 1; }
            echo "${IMAGE}:${t} -> ${DIGEST}" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          if [[ "$prev" == "$DIGEST" ]]; then
            echo "::notice:::latest already named ${DIGEST}; nothing for Watchtower to update."
            echo "digest_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "digest_changed=true" >> "$GITHUB_OUTPUT"
          fi

  # Byte-identical to what was tested: copied out of the promoted image, never rebuilt.
  binaries:
    needs: [check]
    runs-on: self-hosted
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
      packages: read
    env:
      IMAGE: ${{ needs.check.outputs.image }}
      TAG: ${{ needs.check.outputs.tag }}
      DIGEST: ${{ needs.check.outputs.digest }}
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Once per architecture. `docker create` never runs the image, so a non-amd64 copy
      # would need no emulation on this amd64 host. Each architecture is pulled by its own
      # platform manifest digest, not the index digest: the classic image store records an
      # index digest against the first platform pulled and refuses the second ("cannot
      # overwrite digest").
      - name: Copy the binaries out of the tested image
        run: |
          dir="${RUNNER_TEMP}/binaries"
          rm -rf "$dir"
          mkdir -p "$dir"
          index=$(docker buildx imagetools inspect --raw "${IMAGE}@${DIGEST}")
          # ELF e_machine (2 bytes at offset 18) of the binary each platform must carry.
          declare -A machine=([amd64]=62 [arm64]=183)
          # The platforms build-image.yml builds.
          for arch in amd64; do
            pdigest=$(jq -r --arg a "$arch" \
              '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == $a) | .digest] | if length == 1 then .[0] else empty end' \
              <<<"$index")
            if [[ ! "$pdigest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::${IMAGE}@${DIGEST} has no single linux/${arch} manifest."
              exit 1
            fi
            out="${dir}/mcp-md-wiki-linux-${arch}"
            cid=$(docker create --platform "linux/${arch}" "${IMAGE}@${pdigest}")
            docker cp "${cid}:/usr/local/bin/mcp-md-wiki" "$out"
            docker rm "$cid" >/dev/null
            docker image rm "${IMAGE}@${pdigest}" >/dev/null || true
            got=$(od -An -tu2 -j18 -N2 "$out" | tr -d ' ')
            if [[ "$got" != "${machine[$arch]}" ]]; then
              echo "::error::mcp-md-wiki-linux-${arch} is ELF machine ${got}, expected ${machine[$arch]}."
              exit 1
            fi
            echo "mcp-md-wiki-linux-${arch}: $(stat -c %s "$out") bytes, from ${pdigest}"
          done
          (cd "$dir" && sha256sum mcp-md-wiki-linux-* > SHA256SUMS && cat SHA256SUMS)

      # Uploads to the existing release; never creates one. --clobber: re-runs are idempotent.
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "${RUNNER_TEMP}"/binaries/* --clobber --repo "$GITHUB_REPOSITORY"

  notes:
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fill empty release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        run: .github/scripts/release-notes.sh "$TAG"

  # Self-hosted: the pull below lands the new :latest on the host daemon Watchtower
  # compares against, rather than racing registry propagation.
  deploy:
    needs: [check, image]
    runs-on: self-hosted
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      packages: read
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger Watchtower
        env:
          IMAGE: ${{ needs.check.outputs.image }}
          WATCHTOWER_URL: ${{ vars.WATCHTOWER_ATLAS_URL }}
          WATCHTOWER_TOKEN: ${{ secrets.WATCHTOWER_ATLAS_TOKEN }}
          DIGEST_CHANGED: ${{ needs.image.outputs.digest_changed }}
        run: |
          docker pull "${IMAGE}:latest"
          # Do not swallow transport errors — a failed trigger must fail the job.
          response=$(curl -fsSL -X POST \
            -H "Authorization: Bearer ${WATCHTOWER_TOKEN}" \
            "${WATCHTOWER_URL}?image=${IMAGE}:latest")
          echo "${response}"
          updated=$(printf '%s' "${response}" | jq -r '.summary.updated // 0')
          if [ "${updated}" -gt 0 ]; then
            echo "Watchtower updated ${updated} container(s)"
            exit 0
          fi
          # updated=0 is expected when :latest did not actually move — a re-run of a
          # release that already shipped re-applies the manifest already deployed.
          if [ "${DIGEST_CHANGED}" = "false" ]; then
            echo "Watchtower reported updated=0, and :latest did not move — already running this image."
            exit 0
          fi
          # :latest moved, so an update is expected. updated=0 means Watchtower changed
          # nothing — historically because the container lacked the opt-in label while
          # Watchtower runs with WATCHTOWER_LABEL_ENABLE=true. Fail loudly instead.
          echo "::error::Watchtower reported updated=0 after retagging :latest."
          echo "Check that the target container carries the opt-in label:"
          echo "  com.centurylinklabs.watchtower.enable=true"
          echo "and that Watchtower can pull ${IMAGE}:latest."
          exit 1

  # Starts arm64-image.yml for the released commit, so `:latest-arm64` / `:vX.Y.Z-arm64`
  # follow every release. A separate run, not a job of this one: the release does not wait
  # for the arm64 build, and an arm64 failure shows as its own red run rather than failing
  # a release whose amd64 image already shipped. Dispatch is the one GITHUB_TOKEN event
  # that does start a run.
  arm64:
    needs: [check, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch the arm64 build of the released commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run arm64-image.yml --ref master -f sha="$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"

  # Opens the PR that moves master's Cargo.toml to the next patch version, as the App —
  # so it needs no exception in auto-merge.yml's owner-only gate, and its arming starts
  # ci-slow like any PR's (a version-only change builds nothing). Idempotent: an existing
  # roll branch/PR is reused. Only after everything shipped: until then master keeps
  # X.Y.Z, so a failed release is fixed and re-released under the same version.
  roll:
    needs: [check, image, binaries, notes, deploy]
    if: ${{ !cancelled() && needs.check.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The App, never GITHUB_TOKEN: a PR or arming made with GITHUB_TOKEN starts no
      # workflow, so the roll PR would never get ci-fast or ci-slow.
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # The App token is kept in the checkout's config so the push below is the App's.
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: Open and arm the version-roll PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          COMMIT: ${{ github.sha }}
          RELEASED: ${{ needs.check.outputs.version }}
        run: |
          current=$(awk '
            /^\[/ { in_package = ($0 == "[package]") }
            in_package && /^version *=/ { sub(/^version *= *"/, ""); sub(/".*$/, ""); print; exit }
          ' Cargo.toml)
          if [[ "$current" != "$RELEASED" ]]; then
            echo "master's Cargo.toml is at ${current}, not the released ${RELEASED}: a bump already landed; no roll."
            exit 0
          fi
          IFS=. read -r major minor patch <<<"$RELEASED"
          next="${major}.${minor}.$((patch + 1))"
          branch="release/roll-v${next}"
          title="release: roll version to ${next}"

          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --base master --state open --json number --jq '.[0].number // empty')
          review=false
          if [[ -n "$pr" ]]; then
            echo "#${pr} already rolls to ${next}; reusing it."
            # One a previous run deliberately left unarmed stays unarmed.
            if gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json body --jq '.body' | grep -qF 'Needs the owner: not armed.'; then
              review=true
            fi
          else
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
              # A previous run pushed the branch but died before opening the PR.
              git fetch --quiet origin "+refs/heads/${branch}:refs/remotes/origin/${branch}"
              git checkout --quiet -B "$branch" "origin/${branch}"
            else
              git checkout --quiet -B "$branch" origin/master
              notes="${RUNNER_TEMP}/released-notes.md"
              git show "${COMMIT}:CHANGELOG.md" > "${RUNNER_TEMP}/released-changelog.md"
              .github/scripts/changelog-section.sh Unreleased "${RUNNER_TEMP}/released-changelog.md" > "$notes"
              rc=0
              .github/scripts/roll-version.sh "$RELEASED" "$next" "$(date -u +%F)" "$notes" || rc=$?
              if ((rc == 3)); then review=true; elif ((rc != 0)); then exit "$rc"; fi
              got=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "mcp-md-wiki") | .version')
              if [[ "$got" != "$next" ]]; then
                echo "::error::cargo metadata reports ${got} after the roll, expected ${next}."
                exit 1
              fi
              # The App's bot identity, so the commit is attributed to it.
              uid=$(gh api "users/${APP_SLUG}%5Bbot%5D" --jq '.id')
              git -c user.name="${APP_SLUG}[bot]" -c user.email="${uid}+${APP_SLUG}[bot]@users.noreply.github.com" \
                -c commit.gpgsign=false commit --quiet -am "$title"
              git push --quiet origin "HEAD:refs/heads/${branch}"
            fi
            body="Rolls master to the next patch version after releasing v${RELEASED}: \`Cargo.toml\`/\`Cargo.lock\` ${RELEASED} -> ${next}, and CHANGELOG.md's \`[Unreleased]\` section becomes \`[${RELEASED}]\` under a fresh \`[Unreleased]\`. Version-only, so it builds nothing. Opened by release.yml."
            if [[ "$review" == true ]]; then
              body+=$'\n\n'"**Needs the owner: not armed.** master's \`[Unreleased]\` section changed after the released commit, so it was kept as is and the released section was inserted from the released commit; remove the entries that shipped in v${RELEASED} from \`[Unreleased]\`, then arm auto-merge."
            fi
            url=$(gh pr create --repo "$GITHUB_REPOSITORY" --base master --head "$branch" --title "$title" --body "$body")
            pr=${url##*/}
            echo "opened #${pr}"
          fi

          if [[ "$review" == true ]]; then
            echo "::warning::#${pr} left unarmed: CHANGELOG.md needs reconciling by hand (see the PR body)."
            exit 0
          fi
          # Arming fires slow-trigger.yml (auto_merge_enabled), which starts ci-slow.
          gh pr merge "$pr" --auto --merge --repo "$GITHUB_REPOSITORY"
          echo "#${pr} armed for auto-merge"
