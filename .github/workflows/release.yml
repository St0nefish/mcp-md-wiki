name: Release

# Deploys only when the owner publishes a GitHub release — and only then. A merge to
# master runs CI and builds a dev image (dev.yml); it ships nothing. A release is a
# promotion, never a build: dev.yml built every master commit once as `:sha-<commit>`
# (multi-arch); this re-verifies the tagged commit, adds `:latest` and `:<tag>` to that
# same image-index digest, pulls it onto the atlas host and triggers Watchtower. No
# `sha-<commit>` image for the tagged commit means no release.
#
# Cutting a release:
#   1. Merge a PR that bumps `version` in Cargo.toml (and Cargo.lock) and moves
#      CHANGELOG.md's `[Unreleased]` entries under a matching `## [X.Y.Z] - <date>`
#      heading, with its link reference at the bottom. Merging it publishes nothing.
#   2. Once dev.yml has built that commit, the owner creates the release for it, naming
#      the bump commit's SHA rather than `master`:
#        gh release create vX.Y.Z --target <sha of the bump commit> \
#          --title vX.Y.Z --notes "..."
#      With `--target master`, anything merged after the bump would ride along into the
#      release without a CHANGELOG entry. Publishing the release creates the `vX.Y.Z` tag
#      and starts this workflow. The notes given there are replaced by the CHANGELOG
#      section once the image has shipped.
#
# No `push` and no `workflow_dispatch` trigger, deliberately: the only way to move
# `:latest` is an owner-published release of a commit on master, so what is deployed is
# always a named, CHANGELOG-described version. Only the owner can cause a deploy, and they
# have to do two things: create the `v*` tag (a tag ruleset lets only repository admins
# create, move or delete `v*` tags, so neither GITHUB_TOKEN nor the auto-merge App can)
# and publish the release, which `check` enforces by failing unless the event's sender is
# the owner. (A release published with a GitHub App installation token does start
# workflow runs, and the auto-merge App has `contents: write`, so without the sender check
# it could publish a release on an existing, unpublished `v*` tag.) Nothing in this
# workflow ever creates or moves a git tag.
#
#   check          GitHub-hosted, read-only. Fails closed unless: the owner published
#                  the release; the tag is `vX.Y.Z` and names this run's commit; it
#                  matches Cargo.toml's [package] version at that commit; the commit is
#                  on master; CHANGELOG.md has a non-empty `## [X.Y.Z]` section.
#   verify-ci      checks.yml (lint, tests, live-Qdrant suite) on the tagged commit.
#   verify-image   Finds dev.yml's `sha-<commit>` image (waiting a bounded time for a
#                  build still running, then failing closed) and smoke-tests that digest.
#   release        In the `release` environment (deployment policy: `v*` tags only; it
#                  holds WATCHTOWER_ATLAS_TOKEN). Refuses unless the tag is the highest
#                  stable release, retags the verified digest as `:latest` and `:<tag>`,
#                  then triggers Watchtower.
#   release-notes  Replaces the release's notes with the CHANGELOG section, after the
#                  image has shipped.
#
# If the tagged commit is genuinely broken, "re-run failed jobs" cannot help — it re-runs
# the same commit. Merge the fix and release it as a new, higher version (or, as the
# owner, delete the release and its tag with `gh release delete vX.Y.Z --cleanup-tag` and
# create it again at the new commit). A transient failure is re-run with
# `gh run rerun <id> --failed`; every stage is safe to repeat.

on:
  release:
    types: [published]

# One run per tag, never cancelled. GitHub keeps at most one *pending* run per concurrency
# group and cancels the older pending one when a newer run queues, so a single shared
# group could silently drop a release. Per tag, nothing is dropped; runs for different
# tags may overlap, and `:latest` is protected instead by the release job's guard: it
# fails closed, before moving any tag, unless this release is the highest stable
# v<x.y.z> tag, so an older release (published late, or re-run) can never move `:latest`
# backwards.
concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Require the release to be published by the owner
        # The tag ruleset means only the owner can create a `v*` tag, but publishing a
        # release on an existing tag is a separate act: a GitHub App installation token
        # with `contents: write` can do it, and unlike GITHUB_TOKEN it does start
        # workflow runs. Only the owner may.
        env:
          SENDER: ${{ github.event.sender.login }}
        run: |
          if [[ "$SENDER" != "St0nefish" ]]; then
            echo "::error::this release was published by '${SENDER}'; only the repository owner may publish a release."
            exit 1
          fi

      - name: Checkout the tagged commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          # Full history, so the ancestry check below has the commits it needs.
          fetch-depth: 0
          persist-credentials: false

      - name: Match the release tag to the tagged commit's Cargo.toml version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # Stable versions only. A release moves `:latest`, and the release job's
          # highest-stable-tag guard would refuse a pre-release anyway; failing here
          # says why before anything else runs.
          semver='[0-9]+\.[0-9]+\.[0-9]+'
          if [[ ! "$TAG" =~ ^v${semver}$ ]]; then
            echo "::error::release tag '${TAG}' is not of the form vX.Y.Z (pre-releases are not supported: a release moves :latest)"
            exit 1
          fi

          # For a release event GITHUB_SHA is the commit the tag named when the
          # release was published. Confirm the tag still names it and that this
          # checkout is that commit, rather than trust either.
          if [[ "$GITHUB_REF" != "refs/tags/${TAG}" ]]; then
            echo "::error::GITHUB_REF is ${GITHUB_REF}, expected refs/tags/${TAG}"
            exit 1
          fi
          git fetch --no-tags origin "+refs/tags/${TAG}:refs/tags/${TAG}"
          tag_commit=$(git rev-parse "refs/tags/${TAG}^{commit}")
          head_commit=$(git rev-parse HEAD)
          if [[ "$tag_commit" != "$GITHUB_SHA" || "$head_commit" != "$GITHUB_SHA" ]]; then
            echo "::error::tag ${TAG} is at ${tag_commit} and the checkout at ${head_commit}, but the release event names ${GITHUB_SHA}"
            exit 1
          fi

          # The `version` key of the `[package]` table, without needing a Rust
          # toolchain on this runner.
          version=$(awk '
            /^\[/ { in_package = ($0 == "[package]") }
            in_package && /^version *=/ { sub(/^version *= *"/, ""); sub(/".*$/, ""); print; exit }
          ' Cargo.toml)
          if [[ ! "$version" =~ ^${semver}$ ]]; then
            echo "::error::could not read a valid version from Cargo.toml at ${GITHUB_SHA} (got '${version}')"
            exit 1
          fi
          if [[ "$TAG" != "v${version}" ]]; then
            echo "::error::release tag ${TAG} does not match Cargo.toml's version ${version} at ${GITHUB_SHA}. Bump the version in a merged PR first, then release that commit."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Require the tagged commit to be on master
        run: |
          # Fetch master explicitly and fail closed: a failed fetch or a commit
          # master does not contain both stop the release.
          #
          # This catches mistakes; it is not a security boundary. The run uses the
          # workflow file as it exists at the tagged commit, so a tag on an unmerged
          # commit could carry a copy of this file without the check. The boundary is
          # the owner-only `v*` tag ruleset, the `release` environment's `v*`-only
          # deployment policy, and the owner sender check at the top of this job.
          git fetch --no-tags origin "+refs/heads/master:refs/remotes/origin/master"
          status=0
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master || status=$?
          case "$status" in
            0)
              echo "${GITHUB_SHA} is on master"
              ;;
            1)
              echo "::error::${GITHUB_SHA} is not an ancestor of master. Release only a commit that has merged to master."
              exit 1
              ;;
            *)
              echo "::error::git merge-base failed (exit ${status}); cannot tell whether ${GITHUB_SHA} is on master."
              exit 1
              ;;
          esac

      - name: Require a non-empty CHANGELOG section for the version
        # The same extraction `release-notes` uses, so a missing or empty section
        # fails here, before anything is promoted.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v heading="## [${VERSION}]" '
            index($0, heading) == 1 { in_section = 1; next }
            in_section && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            in_section { print }
          ' CHANGELOG.md > "${RUNNER_TEMP}/release-notes.md"
          if ! grep -q '[^[:space:]]' "${RUNNER_TEMP}/release-notes.md"; then
            echo "::error::CHANGELOG.md's '## [${VERSION}]' section is missing or empty; the release notes are taken from it."
            exit 1
          fi

  # The same checks.yml the PR gate and post-merge run, on the exact commit about to be
  # promoted. It restores master's cargo caches but never saves (checks.yml saves only
  # when github.ref is master, and here it is the tag).
  verify-ci:
    needs: [check]
    permissions:
      contents: read
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ github.sha }}

  # Self-hosted: the smoke test runs the image on an amd64 Docker host, the same place
  # dev.yml smoke-tested it. Read-only on the registry; it names the digest `release`
  # promotes, so what ships is exactly what was tested here.
  verify-image:
    needs: [check]
    runs-on: self-hosted
    timeout-minutes: 30
    # actions: the resolve script reads dev.yml's runs, to stop waiting when the build failed.
    permissions:
      contents: read
      packages: read
      actions: read
    outputs:
      image: ${{ steps.resolve.outputs.image }}
      digest: ${{ steps.resolve.outputs.digest }}
      sha_tag: ${{ steps.resolve.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the dev build of the tagged commit
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.sha }}
        run: .github/scripts/resolve-release-image.sh

      - name: Smoke test the image
        run: .github/scripts/smoke-test-image.sh "${{ steps.resolve.outputs.image_ref }}"

  release:
    needs: [check, verify-ci, verify-image]
    runs-on: self-hosted
    timeout-minutes: 15
    environment: release
    # packages: the retag pushes :latest and :<tag> to ghcr.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Immediately before the retag, so a release published meanwhile is seen. See the
      # concurrency comment above for why. A run this guard stops stays failed; to ship a
      # fix on top of a newer release, release it as a new, higher version.
      - name: Refuse to move :latest backwards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          refs=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v")
          highest=$(printf '%s' "${refs}" |
            jq -r '.[].ref | sub("^refs/tags/"; "") | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))' |
            sort -V | tail -n 1)
          if [ -z "${highest}" ] || [ "${TAG}" != "${highest}" ]; then
            echo "::error::${TAG} is not the highest release tag (${highest:-none found}); not moving :latest or any other tag."
            exit 1
          fi
          echo "${TAG} is the highest release tag."

      - name: Tag as latest
        id: retag
        env:
          IMAGE: ${{ needs.verify-image.outputs.image }}
          DIGEST: ${{ needs.verify-image.outputs.digest }}
          SHA_TAG: ${{ needs.verify-image.outputs.sha_tag }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          digest_of() {
            docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' 2>/dev/null |
              jq -r '.digest // empty' || true
          }

          # The digest verify-image smoke-tested must still be what the commit's sha-
          # tag names.
          current=$(digest_of "${IMAGE}:${SHA_TAG}")
          if [ -z "${DIGEST}" ] || [ "${current}" != "${DIGEST}" ]; then
            echo "::error::${IMAGE}:${SHA_TAG} is '${current}', not the verified ${DIGEST}."
            exit 1
          fi

          # What :latest points at now. A re-run of a release that already shipped
          # re-applies the digest :latest already carries, and then Watchtower correctly
          # reports updated=0 — which the step below otherwise treats as a failure.
          PREV_DIGEST=$(digest_of "${IMAGE}:latest")

          # No rebuild, no layer push. The source is dev.yml's multi-arch image index,
          # and a single index source with no annotations is copied verbatim, so the new
          # tags carry the same digest as :sha-<commit> (--prefer-index=false only
          # matters for a single-manifest source). Verified below rather than trusted.
          docker buildx imagetools create \
            --tag "${IMAGE}:latest" \
            --tag "${IMAGE}:${TAG}" \
            "${IMAGE}@${DIGEST}"

          for tag in latest "${TAG}" "${SHA_TAG}"; do
            got=$(digest_of "${IMAGE}:${tag}")
            if [ "${got}" != "${DIGEST}" ]; then
              echo "::error::${IMAGE}:${tag} is '${got}' after the retag, expected ${DIGEST}."
              exit 1
            fi
            echo "${IMAGE}:${tag} -> ${DIGEST}"
          done

          if [ "$PREV_DIGEST" = "$DIGEST" ]; then
            echo "::notice:::latest already pointed at this manifest (${DIGEST}) — nothing for Watchtower to update."
            echo "digest_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "digest_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Watchtower
        env:
          IMAGE: ${{ needs.verify-image.outputs.image }}
          WATCHTOWER_URL: ${{ vars.WATCHTOWER_ATLAS_URL }}
          WATCHTOWER_TOKEN: ${{ secrets.WATCHTOWER_ATLAS_TOKEN }}
          DIGEST_CHANGED: ${{ steps.retag.outputs.digest_changed }}
        run: |
          # Pull the retagged image onto the host daemon first so Watchtower's
          # local digest comparison sees the new :latest immediately, rather
          # than racing registry propagation.
          docker pull "${IMAGE}:latest"
          # Do not swallow transport errors — a failed trigger must fail the job.
          response=$(curl -fsSL -X POST \
            -H "Authorization: Bearer ${WATCHTOWER_TOKEN}" \
            "${WATCHTOWER_URL}?image=${IMAGE}:latest")
          echo "${response}"
          updated=$(printf '%s' "${response}" | jq -r '.summary.updated // 0')
          if [ "${updated}" -gt 0 ]; then
            echo "Watchtower updated ${updated} container(s)"
            exit 0
          fi
          # updated=0 is expected and fine when :latest did not actually move —
          # a re-run of a release that already shipped re-applies the manifest
          # already deployed. Only treat it as a failure when the digest really
          # did change.
          if [ "${DIGEST_CHANGED}" = "false" ]; then
            echo "Watchtower reported updated=0, and :latest did not move — already running this image."
            exit 0
          fi
          # We just retagged :latest to a new digest, so an update is expected.
          # updated=0 means Watchtower saw the request but changed nothing —
          # historically because the container lacked the opt-in label while
          # Watchtower runs with WATCHTOWER_LABEL_ENABLE=true, so the deploy
          # silently no-opped for weeks. Fail loudly instead.
          echo "::error::Watchtower reported updated=0 after retagging :latest."
          echo "Check that the target container carries the opt-in label:"
          echo "  com.centurylinklabs.watchtower.enable=true"
          echo "and that Watchtower can pull ${IMAGE}:latest."
          exit 1

  # Sets the release's notes to the CHANGELOG section once the image has shipped, so a
  # release whose deploy failed keeps the notes it was published with — a visible sign
  # it never went out. Edits the existing release only — never creates a release or a
  # tag (the tag ruleset would refuse GITHUB_TOKEN anyway). Re-running it writes the
  # same notes again.
  release-notes:
    needs: [check, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout the tagged commit
        # Only CHANGELOG.md is read; the release is edited through the API, so the
        # checkout needs no stored credentials.
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Replace the release notes with the CHANGELOG section
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check.outputs.tag }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          # The `## [X.Y.Z]` section, up to the next version heading or the
          # link-reference block at the end of the file. `check` already ran this
          # same extraction and required it to be non-empty.
          awk -v heading="## [${VERSION}]" '
            index($0, heading) == 1 { in_section = 1; next }
            in_section && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            in_section { print }
          ' CHANGELOG.md > "${RUNNER_TEMP}/release-notes.md"
          if ! grep -q '[^[:space:]]' "${RUNNER_TEMP}/release-notes.md"; then
            echo "::error::CHANGELOG.md's '## [${VERSION}]' section is empty or missing."
            exit 1
          fi

          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file "${RUNNER_TEMP}/release-notes.md"
          echo "### Set the ${TAG} release notes from CHANGELOG.md" >> "$GITHUB_STEP_SUMMARY"
