name: Release

# A release is a decision, not a side effect of a merge: the owner starts it by hand,
#   gh workflow run release.yml --ref master                    # releases what :dev names
#   gh workflow run release.yml --ref master -f sha=<commit>    # or one master commit
# (add `-f full_tests=true` to re-run the whole checks.yml first). It never builds: it
# promotes an image the merge train already built and tested (train.yml, `:tree-<tree>`,
# attached to the merge commit as `:sha-<commit>` by master.yml).
#
# The version lives only in Cargo.toml, which on master always holds the NEXT release:
# after every release the `roll` job opens a PR bumping the patch, and a change that
# warrants a minor or major bump raises the version itself in its own PR before it
# merges. Because the version is compiled in (CARGO_PKG_VERSION), it is right before the
# build, and the tag is derived from it, never typed.
#
#   resolve   pins the commit and the digest. With no `sha`: the digest :dev names now,
#             and the newest master commit whose tree is that image's revision label (the
#             tree hash); with `sha`: that commit's `:sha-<commit>` digest. Either way
#             `:sha-<commit>` must name the pinned digest. Every later job uses the pin,
#             so :dev moving mid-release changes nothing.
#   check     fails closed unless the owner started the run; the commit is on master;
#             v<version> (Cargo.toml at the commit) is absent and would be the highest
#             stable v* tag, OR already points at this commit (a resumed release — a tag
#             at another commit fails); CHANGELOG.md's [Unreleased] section at the commit
#             is non-empty (it becomes the release notes).
#   verify    smoke-tests the pinned digest; with full_tests, checks.yml on the commit too.
#             The full suite is not the default: the train built and tested this exact
#             tree, so a re-run only tests flakiness and drift in external services.
#   release   (environment `release`, holds WATCHTOWER_ATLAS_TOKEN) creates the tag and
#             the release at the commit as the GitHub App (a bypass actor on the `v*` tag
#             ruleset; GITHUB_TOKEN cannot create a `v*` tag), sets the notes, attaches
#             the binaries copied out of the tested image, then — guarded again so an
#             older release can never move :latest backwards — retags the digest
#             `:vX.Y.Z` and `:latest` and triggers Watchtower.
#   roll      opens and arms the version-roll PR (patch bump + a fresh [Unreleased]) as
#             the App, unless master's version already moved past the release. It merges
#             through the train like any other PR (a version-only change runs no pipeline).
#
# Why the check's tag rule makes the train's no-pipeline roll PR safe: until a code
# change lands after the roll, :dev still names the released commit's build, whose version
# is already tagged at that commit — a release of it resumes (re-promotes the same digest),
# never publishes something new.
#
# Every step is idempotent: a failed release is re-run (`gh run rerun <id> --failed`, or
# dispatch again with the same `sha`), never repaired by hand. If the commit is genuinely
# broken, merge the fix and release that instead.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Master commit to release (default: the commit :dev names)"
        type: string
        required: false
        default: ""
      full_tests:
        description: "Also run the full checks.yml on the commit before promoting"
        type: boolean
        required: false
        default: false

# One release at a time, never cancelled. A second dispatch waits (GitHub keeps one
# pending run per group, replacing an older pending one — two releases started back to
# back would resolve the same :dev anyway).
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      image: ${{ steps.pin.outputs.image }}
      commit: ${{ steps.pin.outputs.commit }}
      digest: ${{ steps.pin.outputs.digest }}
      version: ${{ steps.pin.outputs.version }}
      tag: ${{ steps.pin.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin the commit and the digest
        id: pin
        env:
          SHA: ${{ inputs.sha }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          digest_of() {
            docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' 2>/dev/null |
              jq -r '.digest // empty' || true
          }
          git fetch --quiet --no-tags origin "+refs/heads/master:refs/remotes/origin/master"

          if [[ -z "$SHA" ]]; then
            digest=$(digest_of "${image}:dev")
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::${image}:dev resolved to no usable digest ('${digest}')."
              exit 1
            fi
            # The revision label: the tree hash for every build since the merge train
            # (build-image.yml); a commit sha for the builds before it. Both platform
            # images carry the same labels; read amd64's.
            revision=$(docker buildx imagetools inspect "${image}@${digest}" --format '{{json .Image}}' |
              jq -r 'if has("linux/amd64") then .["linux/amd64"] else . end
                     | .config.Labels["org.opencontainers.image.revision"] // empty')
            case "$(git cat-file -t "$revision" 2>/dev/null || true)" in
              tree)
                # The newest master commit with exactly that tree (several can share
                # one, e.g. a revert of a revert; the newest is the natural pick).
                commit=$(git log --format='%H %T' origin/master | awk -v t="$revision" '$2 == t { print $1; exit }')
                ;;
              commit) commit=$revision ;;
              *) commit="" ;;
            esac
            if [[ -z "$commit" ]]; then
              echo "::error::${image}:dev (${digest}) has revision label '${revision}', which names no tree or commit on master."
              exit 1
            fi
            echo "${image}:dev is ${digest}, built from master commit ${commit}"
          else
            if ! commit=$(git rev-parse --verify --quiet "${SHA}^{commit}"); then
              echo "::error::'${SHA}' is not a commit in this repository."
              exit 1
            fi
            digest=$(digest_of "${image}:sha-${commit}")
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::${commit} has no ${image}:sha-${commit} image, so there is nothing tested to promote. A docs-only or version-roll commit has none; release the commit :dev names, or a commit with code changes."
              exit 1
            fi
          fi

          # Whichever way the commit was found, its own sha- tag must name the pinned
          # digest: that is the image master.yml attached to this commit.
          sha_digest=$(digest_of "${image}:sha-${commit}")
          if [[ "$sha_digest" != "$digest" ]]; then
            echo "::error::${image}:sha-${commit} is '${sha_digest}', not the pinned ${digest}."
            exit 1
          fi

          # The `version` key of the `[package]` table at the commit.
          version=$(git show "${commit}:Cargo.toml" | awk '
            /^\[/ { in_package = ($0 == "[package]") }
            in_package && /^version *=/ { sub(/^version *= *"/, ""); sub(/".*$/, ""); print; exit }
          ')
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::could not read a valid version from Cargo.toml at ${commit} (got '${version}')"
            exit 1
          fi
          {
            echo "image=${image}"
            echo "commit=${commit}"
            echo "digest=${digest}"
            echo "version=${version}"
            echo "tag=v${version}"
          } | tee -a "$GITHUB_OUTPUT"
          echo "### Releasing v${version}: ${commit} (${digest})" >> "$GITHUB_STEP_SUMMARY"

  check:
    needs: [resolve]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      resume: ${{ steps.tag.outputs.resume }}
    steps:
      # A release is the owner's decision. triggering_actor, not actor: a re-run is
      # attributed to whoever re-ran it.
      - name: Require the owner to have started the run
        env:
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          if [[ "$TRIGGERING_ACTOR" != "St0nefish" ]]; then
            echo "::error::this release was started by '${TRIGGERING_ACTOR}'; only the repository owner may release."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require the commit to be on master
        env:
          COMMIT: ${{ needs.resolve.outputs.commit }}
        run: |
          git fetch --quiet --no-tags origin "+refs/heads/master:refs/remotes/origin/master"
          status=0
          git merge-base --is-ancestor "$COMMIT" origin/master || status=$?
          case "$status" in
            0) echo "${COMMIT} is on master" ;;
            1)
              echo "::error::${COMMIT} is not an ancestor of master. Release only a commit that has merged to master."
              exit 1
              ;;
            *)
              echo "::error::git merge-base failed (exit ${status}); cannot tell whether ${COMMIT} is on master."
              exit 1
              ;;
          esac

      - name: Require a new highest tag, or this release already tagged here
        id: tag
        env:
          COMMIT: ${{ needs.resolve.outputs.commit }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          stable='^v[0-9]+\.[0-9]+\.[0-9]+$'
          tags=$(git ls-remote --tags --refs origin 'refs/tags/v*' | awk '{ sub("^refs/tags/", "", $2); print $2 }' | grep -E "$stable" || true)
          if grep -qxF "$TAG" <<<"$tags"; then
            git fetch --quiet --no-tags origin "+refs/tags/${TAG}:refs/tags/${TAG}"
            at=$(git rev-parse "refs/tags/${TAG}^{commit}")
            if [[ "$at" != "$COMMIT" ]]; then
              echo "::error::${TAG} already exists at ${at}, not at ${COMMIT}. Cargo.toml's version at ${COMMIT} is already released; land the version roll (or a bump) and a change, then release that."
              exit 1
            fi
            echo "${TAG} already points at ${COMMIT}: resuming that release."
            echo "resume=true" >> "$GITHUB_OUTPUT"
          else
            highest=$(printf '%s\n' "$tags" "$TAG" | grep -E "$stable" | sort -V | tail -n 1)
            if [[ "$highest" != "$TAG" ]]; then
              echo "::error::${TAG} would not be the highest release tag (${highest} exists); a release never moves :latest backwards."
              exit 1
            fi
            echo "${TAG} is new and the highest release tag."
            echo "resume=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require a non-empty [Unreleased] section
        run: .github/scripts/changelog-section.sh Unreleased CHANGELOG.md

  verify-smoke:
    needs: [resolve, check]
    runs-on: self-hosted
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      # The smoke test script and the Qdrant pin it reads, as of the released commit.
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke test the pinned image
        run: .github/scripts/smoke-test-image.sh "${{ needs.resolve.outputs.image }}@${{ needs.resolve.outputs.digest }}"

  verify-full:
    needs: [resolve, check]
    if: inputs.full_tests
    permissions:
      contents: read
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ needs.resolve.outputs.commit }}
      fast: true
      integration: true

  release:
    needs: [resolve, check, verify-smoke, verify-full]
    if: >-
      !cancelled() && needs.check.result == 'success' && needs.verify-smoke.result == 'success' &&
      (needs.verify-full.result == 'success' || needs.verify-full.result == 'skipped')
    runs-on: self-hosted
    timeout-minutes: 20
    environment: release
    # packages: the retag pushes :latest and :<tag> to ghcr. Everything that writes to
    # the repository (tag, release, assets) uses the App token.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Creating the release creates the tag at the commit. On a resumed release the tag
      # exists; the release itself may not (a run that died in between), so it is created
      # on the existing tag then. The notes are (re)set either way.
      - name: Create the tag and the release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          COMMIT: ${{ needs.resolve.outputs.commit }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          notes="${RUNNER_TEMP}/release-notes.md"
          .github/scripts/changelog-section.sh Unreleased CHANGELOG.md > "$notes"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release ${TAG} exists; updating its notes."
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$notes"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$COMMIT" --title "$TAG" --notes-file "$notes"
          fi
          # The tag must name the commit whichever path ran (a tag created by someone
          # else between `check` and here would not).
          at=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" --jq '.sha')
          if [[ "$at" != "$COMMIT" ]]; then
            echo "::error::${TAG} names ${at}, not ${COMMIT}."
            exit 1
          fi

      # Byte-identical to what was tested: copied out of the pinned image, once per
      # architecture. `docker create` never runs the image, so a non-amd64 copy would need
      # no emulation on this amd64 host. Each architecture is pulled by its own platform
      # manifest digest, not the index digest: the classic image store records an index
      # digest against the first platform pulled and refuses the second ("cannot
      # overwrite digest").
      - name: Attach the binaries
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          IMAGE: ${{ needs.resolve.outputs.image }}
          DIGEST: ${{ needs.resolve.outputs.digest }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          dir="${RUNNER_TEMP}/binaries"
          rm -rf "$dir"
          mkdir -p "$dir"
          index=$(docker buildx imagetools inspect --raw "${IMAGE}@${DIGEST}")
          files=()
          # ELF e_machine (2 bytes at offset 18) of the binary each platform must carry.
          # The platforms build-image.yml builds.
          declare -A machine=([amd64]=62 [arm64]=183)
          for arch in amd64; do
            pdigest=$(jq -r --arg a "$arch" \
              '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == $a) | .digest] | if length == 1 then .[0] else empty end' \
              <<<"$index")
            if [[ ! "$pdigest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::${IMAGE}@${DIGEST} has no single linux/${arch} manifest."
              exit 1
            fi
            out="${dir}/mcp-md-wiki-linux-${arch}"
            cid=$(docker create --platform "linux/${arch}" "${IMAGE}@${pdigest}")
            docker cp "${cid}:/usr/local/bin/mcp-md-wiki" "$out"
            docker rm "$cid" >/dev/null
            docker image rm "${IMAGE}@${pdigest}" >/dev/null || true
            got=$(od -An -tu2 -j18 -N2 "$out" | tr -d ' ')
            if [[ "$got" != "${machine[$arch]}" ]]; then
              echo "::error::mcp-md-wiki-linux-${arch} is ELF machine ${got}, expected ${machine[$arch]}."
              exit 1
            fi
            echo "mcp-md-wiki-linux-${arch}: $(stat -c %s "$out") bytes, from ${pdigest}"
            files+=("$out")
          done
          gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"

      # Immediately before the retag, so a release made meanwhile is seen. A run this
      # guard stops stays failed; to ship a fix on top of a newer release, release it as a
      # new, higher version.
      - name: Refuse to move :latest backwards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          refs=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v")
          highest=$(printf '%s' "${refs}" |
            jq -r '.[].ref | sub("^refs/tags/"; "") | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))' |
            sort -V | tail -n 1)
          if [ -z "${highest}" ] || [ "${TAG}" != "${highest}" ]; then
            echo "::error::${TAG} is not the highest release tag (${highest:-none found}); not moving :latest or any other tag."
            exit 1
          fi
          echo "${TAG} is the highest release tag."

      - name: Tag as latest
        id: retag
        env:
          IMAGE: ${{ needs.resolve.outputs.image }}
          DIGEST: ${{ needs.resolve.outputs.digest }}
          COMMIT: ${{ needs.resolve.outputs.commit }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          digest_of() {
            docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' 2>/dev/null |
              jq -r '.digest // empty' || true
          }
          SHA_TAG="sha-${COMMIT}"

          # The digest verify-smoke tested must still be what the commit's sha- tag
          # names.
          current=$(digest_of "${IMAGE}:${SHA_TAG}")
          if [ -z "${DIGEST}" ] || [ "${current}" != "${DIGEST}" ]; then
            echo "::error::${IMAGE}:${SHA_TAG} is '${current}', not the verified ${DIGEST}."
            exit 1
          fi

          # What :latest points at now. A re-run of a release that already shipped
          # re-applies the digest :latest already carries, and then Watchtower correctly
          # reports updated=0 — which the step below otherwise treats as a failure.
          PREV_DIGEST=$(digest_of "${IMAGE}:latest")

          # No rebuild, no layer push. The source is the train's image index,
          # and a single index source with no annotations is copied verbatim, so the new
          # tags carry the same digest as :sha-<commit> (--prefer-index=false only
          # matters for a single-manifest source). Verified below rather than trusted.
          docker buildx imagetools create \
            --tag "${IMAGE}:latest" \
            --tag "${IMAGE}:${TAG}" \
            "${IMAGE}@${DIGEST}"

          for tag in latest "${TAG}" "${SHA_TAG}"; do
            got=$(digest_of "${IMAGE}:${tag}")
            if [ "${got}" != "${DIGEST}" ]; then
              echo "::error::${IMAGE}:${tag} is '${got}' after the retag, expected ${DIGEST}."
              exit 1
            fi
            echo "${IMAGE}:${tag} -> ${DIGEST}"
          done

          if [ "$PREV_DIGEST" = "$DIGEST" ]; then
            echo "::notice:::latest already pointed at this manifest (${DIGEST}) — nothing for Watchtower to update."
            echo "digest_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "digest_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Watchtower
        env:
          IMAGE: ${{ needs.resolve.outputs.image }}
          WATCHTOWER_URL: ${{ vars.WATCHTOWER_ATLAS_URL }}
          WATCHTOWER_TOKEN: ${{ secrets.WATCHTOWER_ATLAS_TOKEN }}
          DIGEST_CHANGED: ${{ steps.retag.outputs.digest_changed }}
        run: |
          # Pull the retagged image onto the host daemon first so Watchtower's
          # local digest comparison sees the new :latest immediately, rather
          # than racing registry propagation.
          docker pull "${IMAGE}:latest"
          # Do not swallow transport errors — a failed trigger must fail the job.
          response=$(curl -fsSL -X POST \
            -H "Authorization: Bearer ${WATCHTOWER_TOKEN}" \
            "${WATCHTOWER_URL}?image=${IMAGE}:latest")
          echo "${response}"
          updated=$(printf '%s' "${response}" | jq -r '.summary.updated // 0')
          if [ "${updated}" -gt 0 ]; then
            echo "Watchtower updated ${updated} container(s)"
            exit 0
          fi
          # updated=0 is expected and fine when :latest did not actually move —
          # a re-run of a release that already shipped re-applies the manifest
          # already deployed. Only treat it as a failure when the digest really
          # did change.
          if [ "${DIGEST_CHANGED}" = "false" ]; then
            echo "Watchtower reported updated=0, and :latest did not move — already running this image."
            exit 0
          fi
          # We just retagged :latest to a new digest, so an update is expected.
          # updated=0 means Watchtower saw the request but changed nothing —
          # historically because the container lacked the opt-in label while
          # Watchtower runs with WATCHTOWER_LABEL_ENABLE=true, so the deploy
          # silently no-opped for weeks. Fail loudly instead.
          echo "::error::Watchtower reported updated=0 after retagging :latest."
          echo "Check that the target container carries the opt-in label:"
          echo "  com.centurylinklabs.watchtower.enable=true"
          echo "and that Watchtower can pull ${IMAGE}:latest."
          exit 1

  # Starts arm64-image.yml for the released commit, so `:latest-arm64` / `:vX.Y.Z-arm64`
  # follow every release. A separate run, not a job of this one: the release does not wait
  # for the arm64 build, and an arm64 failure shows as its own red run rather than failing
  # a release whose amd64 image already shipped. Dispatch is the one GITHUB_TOKEN event
  # that does start a run. Explicit condition for the same reason as `roll`'s.
  arm64:
    needs: [resolve, release]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch the arm64 build of the released commit
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ needs.resolve.outputs.commit }}
        run: gh workflow run arm64-image.yml --ref master -f sha="$COMMIT" --repo "$GITHUB_REPOSITORY"

  # Opens the PR that moves master's Cargo.toml to the next patch version, as the App —
  # so it needs no exception in auto-merge.yml's owner-only gate, and the train sees it
  # like any other armed PR. Idempotent: an existing roll branch/PR is reused.
  # Explicit condition: the implicit success() skips a job when anything upstream was
  # skipped, and verify-full is skipped on every release without full_tests.
  roll:
    needs: [resolve, release]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # The App token is kept in the checkout's config so the push below is the App's.
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Open and arm the version-roll PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DISPATCH_TOKEN: ${{ github.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          COMMIT: ${{ needs.resolve.outputs.commit }}
          RELEASED: ${{ needs.resolve.outputs.version }}
        run: |
          current=$(awk '
            /^\[/ { in_package = ($0 == "[package]") }
            in_package && /^version *=/ { sub(/^version *= *"/, ""); sub(/".*$/, ""); print; exit }
          ' Cargo.toml)
          if [[ "$current" != "$RELEASED" ]]; then
            echo "master's Cargo.toml is at ${current}, not the released ${RELEASED}: a bump already landed; no roll."
            exit 0
          fi
          IFS=. read -r major minor patch <<<"$RELEASED"
          next="${major}.${minor}.$((patch + 1))"
          branch="release/roll-v${next}"
          title="release: roll version to ${next}"

          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --base master --state open --json number --jq '.[0].number // empty')
          review=false
          if [[ -n "$pr" ]]; then
            echo "#${pr} already rolls to ${next}; reusing it."
            # One a previous run deliberately left unarmed stays unarmed.
            if gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json body --jq '.body' | grep -qF 'Needs the owner: not armed.'; then
              review=true
            fi
          else
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
              # A previous run pushed the branch but died before opening the PR.
              git fetch --quiet origin "+refs/heads/${branch}:refs/remotes/origin/${branch}"
              git checkout --quiet -B "$branch" "origin/${branch}"
            else
              git checkout --quiet -B "$branch" origin/master
              notes="${RUNNER_TEMP}/released-notes.md"
              git show "${COMMIT}:CHANGELOG.md" > "${RUNNER_TEMP}/released-changelog.md"
              .github/scripts/changelog-section.sh Unreleased "${RUNNER_TEMP}/released-changelog.md" > "$notes"
              rc=0
              .github/scripts/roll-version.sh "$RELEASED" "$next" "$(date -u +%F)" "$notes" || rc=$?
              if ((rc == 3)); then review=true; elif ((rc != 0)); then exit "$rc"; fi
              # rust-toolchain.toml makes this install the pinned toolchain if needed.
              got=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "mcp-md-wiki") | .version')
              if [[ "$got" != "$next" ]]; then
                echo "::error::cargo metadata reports ${got} after the roll, expected ${next}."
                exit 1
              fi
              # The App's bot identity, so the commit is attributed to it.
              uid=$(gh api "users/${APP_SLUG}%5Bbot%5D" --jq '.id')
              git -c user.name="${APP_SLUG}[bot]" -c user.email="${uid}+${APP_SLUG}[bot]@users.noreply.github.com" \
                commit --quiet -am "$title"
              git push --quiet origin "HEAD:refs/heads/${branch}"
            fi
            body="Rolls master to the next patch version after releasing v${RELEASED}: \`Cargo.toml\`/\`Cargo.lock\` ${RELEASED} -> ${next}, and CHANGELOG.md's \`[Unreleased]\` section becomes \`[${RELEASED}]\` under a fresh \`[Unreleased]\`. Opened by release.yml."
            if [[ "$review" == true ]]; then
              body+=$'\n\n'"**Needs the owner: not armed.** master's \`[Unreleased]\` section changed after the released commit, so it was kept as is and the released section was inserted from the released commit; remove the entries that shipped in v${RELEASED} from \`[Unreleased]\`, then arm auto-merge."
            fi
            url=$(gh pr create --repo "$GITHUB_REPOSITORY" --base master --head "$branch" --title "$title" --body "$body")
            pr=${url##*/}
            echo "opened #${pr}"
          fi

          if [[ "$review" == true ]]; then
            echo "::warning::#${pr} left unarmed: CHANGELOG.md needs reconciling by hand (see the PR body)."
            exit 0
          fi
          gh pr merge "$pr" --auto --squash --repo "$GITHUB_REPOSITORY"
          # Arming fires train-trigger.yml too; dispatching here does not depend on it.
          GH_TOKEN=$DISPATCH_TOKEN gh workflow run train.yml --ref master --repo "$GITHUB_REPOSITORY"
