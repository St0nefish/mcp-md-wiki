name: Master

# Attaches a tested image to every master commit that needs one. Nothing here touches
# :latest or Watchtower: a merge deploys nothing, only a release does (release.yml).
#
# The merge train (train.yml) built and tested the image BEFORE the merge, from the local
# squash of the PR onto master, and tagged it `:tree-<tree hash>`. GitHub's squash merge
# reproduces that tree exactly, so for a merge commit:
#
#   1. `:sha-<commit>` already exists        a re-run or dispatch: re-apply the tags below
#                                            to THAT digest (never a different one — the
#                                            sha- and -dev. tags are immutable)
#   2. `:tree-<its tree>` exists             no build, no tests: add `:sha-<commit>` and
#                                            `:<x.y.z>-dev.<n>` to that digest and move
#                                            `:dev` if the commit is still master's tip
#   3. neither, and code paths changed        FALLBACK: the merged tree is not one the
#      (.github/scripts/code-paths.sh)        train tested (a server-side squash that
#                                            differs from git's, a merge that bypassed the
#                                            train), so run the full checks.yml and
#                                            build-image.yml on the commit, then tag as in
#                                            2 — and warn
#   4. neither, no code paths changed         nothing: docs-only and version-roll merges
#                                            have no image, and `:dev` stays put (a release
#                                            targets a commit that has one)
#
# Tags (ghcr.io/<owner>/<repo>), all naming one image-index digest per tree (linux/amd64;
# see build-image.yml):
#   :tree-<tree hash>         train.yml; the build of a tested squash (labels: revision =
#                             the tree hash, version = Cargo.toml's version)
#   :sha-<full commit sha>    immutable; what release.yml resolves
#   :<x.y.z>-dev.<n>          immutable; x.y.z = Cargo.toml's version (on master, the next
#                             release), n = commits since the latest release tag
#                             (.github/scripts/dev-version.sh)
#   :dev                      moves to the newest master commit that has an image
#   :build-<tag>, :buildcache-<arch>   staging and layer cache, not images to run
#
# workflow_dispatch with `sha` re-processes one master commit (a cancelled or failed run):
# `gh workflow run master.yml --ref master -f sha=<commit>`. It refuses a commit that is
# not on master.

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      sha:
        description: "Master commit to (re)process (default: master's tip)"
        type: string
        required: false
        default: ""

# Keyed by commit: different commits run side by side (the :dev guard keeps a slower,
# older run from moving :dev backwards), while a re-run or dispatch of the same commit
# queues behind the in-flight one instead of racing it to the same tags. Never cancelled —
# a cancelled run leaves a commit with no image to release.
concurrency:
  group: master-${{ inputs.sha || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      image: ${{ steps.image.outputs.name }}
      commit: ${{ steps.version.outputs.commit }}
      tree: ${{ steps.plan.outputs.tree }}
      version: ${{ steps.version.outputs.version }}
      sha_tag: ${{ steps.version.outputs.sha_tag }}
      mode: ${{ steps.plan.outputs.mode }}
      digest: ${{ steps.plan.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha || github.sha }}
          # dev-version.sh counts commits since the latest release tag.
          fetch-depth: 0

      - name: Refuse a commit that is not on master
        run: |
          git fetch --quiet --no-tags origin "+refs/heads/master:refs/remotes/origin/master"
          status=0
          git merge-base --is-ancestor HEAD origin/master || status=$?
          case "$status" in
            0) ;;
            1)
              echo "::error::$(git rev-parse HEAD) is not on master; master images are attached to master commits only."
              exit 1
              ;;
            *)
              echo "::error::git merge-base failed (exit ${status}); cannot tell whether $(git rev-parse HEAD) is on master."
              exit 1
              ;;
          esac

      - name: Compute version and tags
        id: version
        run: .github/scripts/dev-version.sh

      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A registry error is not "not found" — fail rather than rebuild over, or skip, a
      # tag that might exist.
      - name: Decide what this commit needs
        id: plan
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          SHA_TAG: ${{ steps.version.outputs.sha_tag }}
        run: |
          # Prints the digest <ref> names, nothing when it does not exist; fails on any
          # other registry error.
          digest_of() {
            local out
            if out=$(docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' 2>&1); then
              jq -r '.digest' <<<"$out"
            elif ! grep -qiE 'not found|manifest unknown' <<<"$out"; then
              echo "::error::Cannot inspect $1: ${out}" >&2
              return 1
            fi
          }
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree=${tree}" >> "$GITHUB_OUTPUT"
          sha_digest=$(digest_of "${IMAGE}:${SHA_TAG}")
          tree_digest=$(digest_of "${IMAGE}:tree-${tree}")

          # An existing sha- tag wins and is only re-applied (same digest, so nothing
          # changes): that finishes a run that died before moving :dev.
          if [[ -n "$sha_digest" ]]; then
            echo "${IMAGE}:${SHA_TAG} already exists (${sha_digest}); re-applying its tags to that digest."
            digest=$sha_digest
            mode=tag
          elif [[ -n "$tree_digest" ]]; then
            echo "${IMAGE}:tree-${tree} (${tree_digest}) is the train's tested build of this tree."
            digest=$tree_digest
            mode=tag
          else
            digest=""
            if git rev-parse --verify --quiet 'HEAD^' >/dev/null; then
              code=$(.github/scripts/code-paths.sh 'HEAD^' HEAD)
            else
              code=true
            fi
            if [[ "$code" == true ]]; then
              echo "::warning::No train-built image for tree ${tree}: this merge's tree is not one the merge train tested. Running the full checks and build on the commit."
              mode=build
            else
              echo "No code paths changed and no image for this tree; nothing to attach, :dev stays where it is."
              mode=none
            fi
          fi
          echo "mode=${mode}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "### $(git rev-parse HEAD): ${mode}" >> "$GITHUB_STEP_SUMMARY"

  # Fallback only. The full suite first, then the build, so a fallback image is never
  # tagged `sha-` (releasable) before the commit's tests passed.
  checks:
    needs: [prepare]
    if: needs.prepare.outputs.mode == 'build'
    permissions:
      contents: read
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ needs.prepare.outputs.commit }}
      fast: true
      integration: true

  build:
    needs: [prepare, checks]
    if: needs.prepare.outputs.mode == 'build'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      ref: ${{ needs.prepare.outputs.commit }}
      tag: ${{ needs.prepare.outputs.sha_tag }}
      revision: ${{ needs.prepare.outputs.tree }}
      version: ${{ needs.prepare.outputs.version }}

  tag:
    needs: [prepare, build]
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      (needs.prepare.outputs.mode == 'tag' ||
       (needs.prepare.outputs.mode == 'build' && needs.build.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The source is a single image index with no annotations, which `imagetools create`
      # copies verbatim, so the new tags name the tested index digest rather than a new
      # index. (--prefer-index=false is for a single-MANIFEST source, where the default
      # would wrap it in a new index; an index source is copied either way.) The digest
      # check below proves it rather than trusting it.
      - name: Tag the tested build for this commit
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          DIGEST: ${{ needs.prepare.outputs.digest || needs.build.outputs.digest }}
          SHA_TAG: ${{ needs.prepare.outputs.sha_tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::no usable digest to tag: '${DIGEST}'"
            exit 1
          fi
          docker buildx imagetools create \
            --tag "${IMAGE}:${SHA_TAG}" \
            --tag "${IMAGE}:${VERSION}" \
            "${IMAGE}@${DIGEST}"
          for tag in "${SHA_TAG}" "${VERSION}"; do
            got=$(docker buildx imagetools inspect "${IMAGE}:${tag}" --format '{{json .Manifest}}' | jq -r '.digest')
            if [ "${got}" != "${DIGEST}" ]; then
              echo "::error::${IMAGE}:${tag} is ${got} after the retag, expected ${DIGEST}."
              exit 1
            fi
            echo "${IMAGE}:${tag} -> ${DIGEST}"
          done

      # Only the commit that is master's tip moves :dev, so a slower run for an older
      # commit never moves it backwards. If this commit is no longer the tip, the newer
      # commit's run moves it — or, when the newer commits are docs-only, :dev correctly
      # stays on this build.
      - name: Move :dev
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          DIGEST: ${{ needs.prepare.outputs.digest || needs.build.outputs.digest }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tip=$(gh api "repos/${GITHUB_REPOSITORY}/commits/master" --jq '.sha')
          if [ -z "${tip}" ]; then
            echo "::error::could not read master's tip; leaving :dev alone."
            exit 1
          fi
          if [ "${tip}" != "${COMMIT}" ]; then
            echo "::notice::${COMMIT} is no longer master's tip (${tip}); leaving :dev alone."
            exit 0
          fi
          docker buildx imagetools create --tag "${IMAGE}:dev" "${IMAGE}@${DIGEST}"
          got=$(docker buildx imagetools inspect "${IMAGE}:dev" --format '{{json .Manifest}}' | jq -r '.digest')
          if [ "${got}" != "${DIGEST}" ]; then
            echo "::error::${IMAGE}:dev is ${got} after the retag, expected ${DIGEST}."
            exit 1
          fi
          echo "${IMAGE}:dev -> ${DIGEST}"
