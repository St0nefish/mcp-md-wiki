name: Post-Merge

# The ruleset's required_status_checks does not require PR branches to stay
# up to date with master (strict_required_status_checks_policy: false), so
# two PRs that were each green against an older master can still combine into
# a broken master (a semantic conflict no textual merge conflict catches).
# That trade buys order-independent landing for concurrent PRs; this workflow
# is what catches the rare breakage it allows, immediately after the merge.
#
# Deliberately NOT a required status check -- it runs after the merge, not
# before, so it cannot gate anything. See dev/tools/repo-workflow-patterns.md
# in the knowledge base for the full rationale (Pattern C: a merge runs CI and
# builds a dev image; only a published release ships).
#
# Runs the full checks.yml -- the same lint, unit-test and live-Qdrant jobs the
# PR gate runs -- on the combined tree. They run on the self-hosted runners in
# parallel, so the Qdrant suite costs no extra wall clock here. This is also the
# only caller that runs on master, so it is what saves the cargo caches every
# PR restores (see checks.yml's cache steps). A red run here also means the
# commit is not releasable: release.yml re-runs checks.yml on the tagged commit.

on:
  push:
    branches: [master]

# One run at a time, never cancelled. A pending run is superseded by a newer
# push's pending run (GitHub keeps one pending run per group), which still
# checks the newest combined tree; an in-progress run always finishes so its
# cache save is not cut off halfway.
concurrency:
  group: post-merge
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
