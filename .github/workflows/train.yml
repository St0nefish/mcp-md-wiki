name: Merge train

# Serialized, test-once PR merging. Design (and the platform behavior it relies on, verified
# live): the knowledge base's dev/tools/merge-train-pattern.md.
#
# A PR joins the queue by having squash auto-merge armed (auto-merge.yml arms the owner's
# PRs on open; the owner arming anyone else's PR is the approval). Each run of this
# workflow takes ONE PR — the oldest armed PR whose current head carries no train status —
# pins its head and current master, squashes the head onto master locally
# (.github/scripts/train-squash.sh), and tests exactly that tree:
#
#   select            sweep stale train greens, choose and pin the PR, squash, post
#                     `ci-fast` + `ci-slow` pending
#   fast              checks.yml fast tier (fmt, clippy, audit, unit tests) on the squash
#   post-fast         `ci-fast` success as soon as the fast tier passed
#   slow-integration  checks.yml live-Qdrant suite on the squash      } in parallel, only
#   slow-image        build-image.yml: build, smoke test, `:tree-<tree>` } after `fast`
#   land              if the head did not move meanwhile, `ci-slow` success; then wait for
#                     GitHub's auto-merge to squash-merge the PR
#   finish            on any failure or cancellation, both statuses to `failure` plus a PR
#                     comment (unless the head moved — that is benign); then dispatch the
#                     next run if another armed PR has an untested head
#
# `ci-fast` and `ci-slow` are the required checks, and only this workflow posts them, so
# nothing merges without passing through it; one run at a time is what serializes merges.
# The required-checks rule keeps "require branches to be up to date" OFF: the PR head stays
# behind master by design — the train tests the squash, not the head. A green status
# certifies "this head squashed onto master <base>, tree <tree>", not the head alone.
#
# A PR that touches no code path (.github/scripts/code-paths.sh — docs, or a version-only
# bump like the post-release roll PR) still queues, so it lands in order, but runs no
# pipeline: `land` posts both statuses green directly.
#
# A head that failed is not retried until it changes: a push re-queues the PR, and
# `gh workflow run train.yml --ref master -f pr=<n>` re-tests the same head (a flaky
# failure).
#
# Trust: this workflow always runs master's copy. The event-driven entry point
# (train-trigger.yml, pull_request_target) only dispatches it with `--ref master`, so a PR
# editing the train cannot test itself with its own edits; `select` refuses any other ref.
# The PR's code does run (it is what is tested), on the self-hosted runners, through
# the same checks.yml every caller uses. GITHUB_TOKEN only: the train never pushes, so it needs
# statuses, pull-requests and actions (to dispatch itself), not contents: write. Statuses
# posted with it are attributed to the GitHub Actions app, which the ruleset can pin the
# required checks' source to.

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Re-test this PR's current head (default: the oldest armed PR with an untested head)"
        type: string
        required: false
        default: ""
  # Restarts the queue after a run that died before dispatching its successor. A run with
  # nothing to do exits in seconds.
  schedule:
    - cron: "*/15 * * * *"

# Exactly one train at a time, never cancelled: cancelling mid-run would leave pending
# statuses behind (the sweep cleans them up, but only on the next run). GitHub keeps at
# most one PENDING run in the group and replaces it with a newer one; that loses nothing,
# because no run is bound to a PR in advance — each takes the head of the queue when it
# starts.
concurrency:
  group: train
  cancel-in-progress: false

permissions:
  contents: read

env:
  CTX_FAST: ci-fast
  CTX_SLOW: ci-slow
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: write
      pull-requests: write
    outputs:
      found: ${{ steps.select.outputs.found }}
      pr: ${{ steps.select.outputs.pr }}
      head: ${{ steps.select.outputs.head }}
      base: ${{ steps.select.outputs.base }}
      tree: ${{ steps.select.outputs.tree }}
      code: ${{ steps.select.outputs.code }}
      version: ${{ steps.select.outputs.version }}
      dispatch_next: ${{ steps.select.outputs.dispatch_next }}
    steps:
      # A dispatch names the ref whose workflow file runs; anything but master would be a
      # train someone edited, posting the statuses master's train is trusted for.
      - name: Refuse to run from anything but master
        if: github.ref != 'refs/heads/master'
        run: |
          echo "::error::the merge train runs only from master (this run: ${GITHUB_REF}); dispatch it with --ref master."
          exit 1

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Sweep, select, pin and squash
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          PR_INPUT: ${{ inputs.pr }}
        run: |
          # The squash below rewrites this checkout, scripts included (a PR may edit
          # them). Everything this job runs after it is master's copy, from here.
          scripts="${RUNNER_TEMP}/train-scripts"
          cp -R .github/scripts "$scripts"
          # shellcheck source=/dev/null
          . "$scripts/train-lib.sh"
          out() { echo "$1=$2" | tee -a "$GITHUB_OUTPUT"; }
          out found false

          prs=$(armed_prs)
          mapfile -t queue <<<"$prs"
          [[ -n "$prs" ]] || queue=()
          echo "armed PRs into master, oldest first: ${#queue[@]}"

          # Sweep. Exactly one train runs at a time, and this one has posted nothing
          # yet, so any train `success` or `pending` on an armed head is left over from a
          # run that died before `finish` could clean up. A stale green must not stay: it
          # would let the PR merge onto a master it was never tested against.
          for entry in "${queue[@]}"; do
            read -r num sha <<<"$entry"
            for ctx in "$CTX_FAST" "$CTX_SLOW"; do
              st=$(ctx_status "$sha" "$ctx")
              state=${st%% *} desc=${st#* }
              if [[ ("$state" == success || "$state" == pending) && "$desc" == train:* ]]; then
                echo "#${num}: ${ctx} is a stale ${state} (${desc})"
                post_status "$sha" "$CTX_FAST" failure "train: reset — left over from an interrupted run"
                post_status "$sha" "$CTX_SLOW" failure "train: reset — left over from an interrupted run"
                break
              fi
            done
          done

          # Choose.
          pr="" head=""
          if [[ -n "$PR_INPUT" ]]; then
            if [[ ! "$PR_INPUT" =~ ^[0-9]+$ ]]; then
              echo "::error::input pr must be a PR number, got '${PR_INPUT}'"
              exit 1
            fi
            for entry in "${queue[@]}"; do
              read -r num sha <<<"$entry"
              if [[ "$num" == "$PR_INPUT" ]]; then pr=$num head=$sha; fi
            done
            if [[ -z "$pr" ]]; then
              echo "::error::#${PR_INPUT} is not an open PR into master with auto-merge armed."
              exit 1
            fi
          else
            for entry in "${queue[@]}"; do
              read -r num sha <<<"$entry"
              if untested "$sha"; then pr=$num head=$sha; break; fi
            done
          fi
          if [[ -z "$pr" ]]; then
            echo "Nothing to test: no armed PR has an untested head."
            echo "### Nothing to test" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Pin. Every later job squashes exactly these two commits and must arrive at
          # this tree.
          git fetch --quiet --no-tags origin "+refs/heads/master:refs/remotes/origin/master"
          base=$(git rev-parse origin/master)
          echo "testing #${pr}: ${head} onto master ${base}"
          rc=0
          tree=$("$scripts/train-squash.sh" "$base" "$head") || rc=$?
          if ((rc == 2)); then
            post_status "$head" "$CTX_FAST" failure "train: conflicts with master ${base:0:7} — rebase and push"
            comment "$pr" "The merge train could not test ${head:0:7}: it conflicts with master (${base:0:7}). Rebase onto master and push; the new head re-queues automatically. ([run](${RUN_URL}))"
            out dispatch_next true
            exit 0
          elif ((rc != 0)); then
            exit "$rc"
          fi

          code=$("$scripts/code-paths.sh" "$base" HEAD)
          # The `version` key of the `[package]` table, from the squash: the version this
          # build compiles in (CARGO_PKG_VERSION) and labels the image with.
          version=$(awk '
            /^\[/ { in_package = ($0 == "[package]") }
            in_package && /^version *=/ { sub(/^version *= *"/, ""); sub(/".*$/, ""); print; exit }
          ' Cargo.toml)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::could not read a valid [package] version from the squash's Cargo.toml (got '${version}')"
            exit 1
          fi

          desc="train: testing squash of ${head:0:7} onto ${base:0:7}"
          post_status "$head" "$CTX_FAST" pending "$desc"
          post_status "$head" "$CTX_SLOW" pending "$desc"

          out pr "$pr"
          out head "$head"
          out base "$base"
          out tree "$tree"
          out code "$code"
          out version "$version"
          out found true
          {
            echo "### Testing #${pr}"
            echo "squash of \`${head}\` onto master \`${base}\`, tree \`${tree}\`"
            echo "code paths changed: ${code}; version: ${version}"
          } >> "$GITHUB_STEP_SUMMARY"

  fast:
    needs: [select]
    if: needs.select.outputs.found == 'true' && needs.select.outputs.code == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/checks.yml
    with:
      base-sha: ${{ needs.select.outputs.base }}
      head-sha: ${{ needs.select.outputs.head }}
      expected-tree: ${{ needs.select.outputs.tree }}
      fast: true
      integration: false

  # Reported the moment the fast tier passes, so a PR shows its lint/unit result without
  # waiting for the image and the integration suite.
  post-fast:
    needs: [select, fast]
    if: needs.fast.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts

      - name: Post ci-fast success
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.select.outputs.head }}
          TREE: ${{ needs.select.outputs.tree }}
        run: |
          # shellcheck source=/dev/null
          . .github/scripts/train-lib.sh
          post_status "$HEAD_SHA" "$CTX_FAST" success "train: fmt/clippy/unit passed on tree ${TREE:0:7}"

  slow-integration:
    needs: [select, fast]
    if: needs.fast.result == 'success'
    permissions:
      contents: read
    uses: ./.github/workflows/checks.yml
    with:
      base-sha: ${{ needs.select.outputs.base }}
      head-sha: ${{ needs.select.outputs.head }}
      expected-tree: ${{ needs.select.outputs.tree }}
      fast: false
      integration: true

  # Named after the tree, not a commit: the merge commit does not exist until GitHub
  # squash-merges the PR, and its tree is this one. master.yml finds the image by it.
  slow-image:
    needs: [select, fast]
    if: needs.fast.result == 'success'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      base-sha: ${{ needs.select.outputs.base }}
      head-sha: ${{ needs.select.outputs.head }}
      expected-tree: ${{ needs.select.outputs.tree }}
      tag: tree-${{ needs.select.outputs.tree }}
      revision: ${{ needs.select.outputs.tree }}
      version: ${{ needs.select.outputs.version }}

  # Runs when select chose a PR and either nothing needed testing (no code paths) or every
  # stage passed. `!cancelled()` rather than the implicit success(): on the no-code path
  # the test jobs are skipped, which the default condition would treat as a reason to skip.
  land:
    needs: [select, fast, post-fast, slow-integration, slow-image]
    if: >-
      !cancelled() && needs.select.result == 'success' && needs.select.outputs.found == 'true' &&
      (needs.select.outputs.code == 'false' ||
       (needs.post-fast.result == 'success' && needs.slow-integration.result == 'success' &&
        needs.slow-image.result == 'success'))
    runs-on: ubuntu-latest
    # The 10-minute merge wait below plus margin.
    timeout-minutes: 15
    permissions:
      contents: read
      statuses: write
      pull-requests: read
    outputs:
      moved: ${{ steps.land.outputs.moved }}
      merged: ${{ steps.land.outputs.merged }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts

      - name: Post ci-slow and wait for the merge
        id: land
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.select.outputs.pr }}
          HEAD_SHA: ${{ needs.select.outputs.head }}
          BASE_SHA: ${{ needs.select.outputs.base }}
          TREE: ${{ needs.select.outputs.tree }}
          CODE: ${{ needs.select.outputs.code }}
        run: |
          # shellcheck source=/dev/null
          . .github/scripts/train-lib.sh
          pr_json() { gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}"; }

          # A push during the run means what was tested is not what would merge. Post
          # nothing: the statuses on the old head no longer count, and the new head
          # re-queues (finish dispatches the next run).
          now=$(pr_json | jq -r '.head.sha')
          if [[ "$now" != "$HEAD_SHA" ]]; then
            echo "::notice::#${PR} moved from ${HEAD_SHA} to ${now} during the run; posting nothing."
            echo "moved=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          what="squash of ${HEAD_SHA:0:7} onto ${BASE_SHA:0:7}, tree ${TREE:0:7}"
          if [[ "$(ctx_status "$HEAD_SHA" "$CTX_FAST")" != success* ]]; then
            if [[ "$CODE" == false ]]; then
              post_status "$HEAD_SHA" "$CTX_FAST" success "train: no code paths changed — ${what}"
            else
              post_status "$HEAD_SHA" "$CTX_FAST" success "train: fmt/clippy/unit passed — ${what}"
            fi
          fi
          if [[ "$CODE" == false ]]; then
            post_status "$HEAD_SHA" "$CTX_SLOW" success "train: no code paths changed — ${what}"
          else
            post_status "$HEAD_SHA" "$CTX_SLOW" success "train: integration + image passed — ${what}"
          fi

          # GitHub's auto-merge lands it, typically 10-45 s after the last status. The
          # next PR must not be tested until this one is on master, so wait here.
          deadline=$((SECONDS + 600))
          while :; do
            pr=$(pr_json)
            if [[ "$(jq -r '.merged' <<<"$pr")" == true ]]; then
              echo "#${PR} merged as $(jq -r '.merge_commit_sha' <<<"$pr")"
              echo "merged=true" >> "$GITHUB_OUTPUT"
              echo "### Landed #${PR}" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [[ "$(jq -r '.state' <<<"$pr")" == closed ]]; then
              echo "::notice::#${PR} was closed without merging."
              exit 0
            fi
            if [[ "$(jq -r '.head.sha' <<<"$pr")" != "$HEAD_SHA" ]]; then
              echo "::notice::#${PR} moved to $(jq -r '.head.sha' <<<"$pr") before it merged."
              echo "moved=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if ((SECONDS >= deadline)); then
              echo "::error::#${PR} did not merge within 10 minutes of both statuses going green. Is auto-merge still armed? Does the ruleset require a check other than ${CTX_FAST}/${CTX_SLOW}?"
              exit 1
            fi
            sleep 10
          done

  finish:
    needs: [select, fast, post-fast, slow-integration, slow-image, land]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts

      # A failed, cancelled or timed-out stage leaves `pending` (or a green `ci-fast`)
      # behind; turn both to failure so the PR shows red and does not merge on a later
      # stale green. Skipped when the head moved — that is the benign cause, and the
      # statuses on the old head no longer matter.
      - name: Mark a failed run on the PR
        if: needs.select.outputs.found == 'true' && needs.land.outputs.moved != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
          PR: ${{ needs.select.outputs.pr }}
          HEAD_SHA: ${{ needs.select.outputs.head }}
        run: |
          # shellcheck source=/dev/null
          . .github/scripts/train-lib.sh
          stage=""
          for job in select fast post-fast slow-integration slow-image land; do
            result=$(jq -r --arg j "$job" '.[$j].result' <<<"$NEEDS")
            if [[ "$result" == failure || "$result" == cancelled ]]; then
              stage="$job ($result)"
              break
            fi
          done
          if [[ -z "$stage" ]]; then
            echo "No stage failed."
            exit 0
          fi
          now=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" --jq '.head.sha')
          if [[ "$now" != "$HEAD_SHA" ]]; then
            echo "::notice::#${PR} moved to ${now}; ${stage} on the old head needs no marking."
            exit 0
          fi
          post_status "$HEAD_SHA" "$CTX_FAST" failure "train: ${stage} failed — ${RUN_URL}"
          post_status "$HEAD_SHA" "$CTX_SLOW" failure "train: ${stage} failed — ${RUN_URL}"
          comment "$PR" "The merge train failed on ${HEAD_SHA:0:7}: \`${stage}\` ([run](${RUN_URL})). Push a fix to re-queue the PR, or, for a flaky failure, re-test this head with \`gh workflow run train.yml --ref master -f pr=${PR}\`."
          echo "::error::#${PR}: ${stage}"
          exit 1

      # Only after a select that ran to completion: if select itself failed, dispatching
      # would just fail the same way in a loop; the 15-minute schedule retries instead.
      - name: Dispatch the next run
        if: always() && needs.select.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # shellcheck source=/dev/null
          . .github/scripts/train-lib.sh
          prs=$(armed_prs)
          while read -r num sha; do
            [[ -n "$num" ]] || continue
            if untested "$sha"; then
              echo "#${num} (${sha:0:7}) is untested; dispatching the next train run."
              gh workflow run train.yml --ref master --repo "$GITHUB_REPOSITORY"
              exit 0
            fi
          done <<<"$prs"
          echo "No armed PR has an untested head; the queue is empty."
