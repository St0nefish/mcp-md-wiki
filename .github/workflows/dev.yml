name: Dev image

# Builds the image once per commit on master, natively for amd64 and arm64. PRs build
# no image, and a release promotes the build of its tagged commit (release.yml) and never
# builds one itself, so this run's status on a master commit is the signal for whether that
# commit is releasable. The build is pushed only under a staging tag; the tags a release or
# a deployment reads are added after the smoke test passes. A build that fails, or fails
# its smoke test, never gets a `sha-` tag, and a release of that commit fails closed. (A run
# that goes red later, while tagging or moving :dev, may leave a smoke-tested `sha-` image
# behind; that one is releasable.) Nothing here touches :latest or triggers Watchtower.
#
# Tags (ghcr.io/<owner>/<repo>), all multi-arch (linux/amd64 + linux/arm64):
#   :build-<full commit sha>  staging; every pushed build, smoke-tested or not
#   :sha-<full commit sha>    immutable, after the smoke test; what release.yml resolves
#   :<x.y.z>-dev.<n>          immutable, after the smoke test; x.y.z = latest release's
#                             patch + 1 (Cargo.toml's version before the first release),
#                             n = commits since it (.github/scripts/dev-version.sh)
#   :dev                      moves to the newest master commit whose build passed
#   :buildcache-<arch>        registry layer cache, one per architecture, not an image
# The first four name the same image-index digest.
#
# A commit that already has its `sha-` image is not rebuilt (the run succeeds without
# building), so a re-run or a dispatch never overwrites an immutable tag. workflow_dispatch
# builds a master commit that has none (a cancelled or failed run):
# `gh workflow run dev.yml --ref <branch or tag>`. It refuses a commit that is not on
# master, and a dispatch runs the workflow file at that ref, so a commit from before this
# workflow existed cannot be built this way.
#
# The cargo caches PR CI restores are saved by post-merge.yml (checks.yml, on master), not
# here: the image build uses its own registry layer cache and never touches them.

on:
  push:
    branches: [master]
    # Claude Code config does not affect the image; skip the multi-arch build for it.
    paths-ignore:
      - ".claude/**"
      - "CLAUDE.md"
  workflow_dispatch:

# Keyed by commit: builds of different commits run side by side (the :dev guard below
# keeps a slower, older build from moving :dev backwards), while a re-run or dispatch of
# the same commit queues behind the in-flight one instead of racing it to the same tags.
# Never cancelled — a cancelled run leaves a commit with no image to release.
concurrency:
  group: dev-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Decides what to build and whether to build at all, before any runner spends time on a
  # compile.
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      image: ${{ steps.image.outputs.name }}
      rust_version: ${{ steps.rust_version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
      version: ${{ steps.version.outputs.version }}
      sha_tag: ${{ steps.version.outputs.sha_tag }}
      exists: ${{ steps.existing.outputs.exists }}
    steps:
      - uses: actions/checkout@v5
        with:
          # dev-version.sh counts commits since the latest release tag.
          fetch-depth: 0

      - name: Refuse a commit that is not on master
        run: |
          status=0
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/master || status=$?
          case "$status" in
            0) ;;
            1)
              echo "::error::${GITHUB_SHA} is not on master; dev images are built from master only."
              exit 1
              ;;
            *)
              echo "::error::git merge-base failed (exit ${status}); cannot tell whether ${GITHUB_SHA} is on master."
              exit 1
              ;;
          esac

      - name: Read pinned Rust toolchain version
        id: rust_version
        run: .github/scripts/rust-version.sh

      - name: Compute version and tags
        id: version
        run: .github/scripts/dev-version.sh

      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # sha- and -dev. tags are immutable: a commit that has its image keeps it. A
      # registry error is not "not found" — fail rather than rebuild over a tag that
      # might exist.
      - name: Skip a commit that already has its image
        id: existing
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          SHA_TAG: ${{ steps.version.outputs.sha_tag }}
        run: |
          if out=$(docker buildx imagetools inspect "${IMAGE}:${SHA_TAG}" --format '{{json .Manifest}}' 2>&1); then
            echo "${IMAGE}:${SHA_TAG} already exists ($(jq -r '.digest' <<<"${out}")); not rebuilding, so its tags stay as they are."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -qiE 'not found|manifest unknown' <<<"${out}"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Cannot inspect ${IMAGE}:${SHA_TAG}: ${out}"
            exit 1
          fi

  # One native build per architecture: amd64 on the self-hosted runners, arm64 on
  # GitHub's hosted arm64 runner (free for a public repo; atlas has no arm64 host), so
  # neither needs QEMU. Each pushes its image by digest only — no tag — and hands the
  # digest to `merge`, which is the only job that names anything.
  build:
    needs: [prepare]
    if: needs.prepare.outputs.exists == 'false'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      # One architecture failing means no index can be made, so stop the other early.
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: self-hosted
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      # A docker-container builder: the default docker driver can neither push by
      # digest nor export a registry cache.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # VERSION/REVISION feed the Dockerfile's OCI labels, which /status reports as
      # the build identity. provenance: false keeps each per-arch push a single image
      # manifest, so the index `merge` builds holds exactly the two platform images and
      # no unknown/unknown attestation entries. The layer cache is per architecture:
      # the two builds share no layers, and one ref would have them overwrite each
      # other's cache on every run.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            RUST_VERSION=${{ needs.prepare.outputs.rust_version }}
            VERSION=${{ needs.prepare.outputs.version }}
            REVISION=${{ needs.prepare.outputs.commit }}
          provenance: false
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-${{ matrix.arch }},mode=max

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::build produced no usable digest: '${DIGEST}'"
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Joins the per-arch digests into one image index, smoke-tests it, and only then gives
  # it the tags anything reads. Self-hosted, because that is an amd64 host with Docker
  # where the smoke test can run the image (it pulls the amd64 entry of the index).
  merge:
    needs: [prepare, build]
    runs-on: self-hosted
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      # For the smoke-test script and for `git ls-remote` in the :dev step.
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed under the staging tag only; nothing reads build- tags.
      - name: Create the multi-arch index
        id: index
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          refs=()
          for f in "${RUNNER_TEMP}"/digests/*; do
            refs+=("${IMAGE}@sha256:$(basename "$f")")
          done
          if [ "${#refs[@]}" -ne 2 ]; then
            echo "::error::expected 2 per-arch digests (amd64, arm64), got ${#refs[@]}: ${refs[*]}"
            exit 1
          fi
          docker buildx imagetools create --tag "${IMAGE}:build-${COMMIT}" "${refs[@]}"
          digest=$(docker buildx imagetools inspect "${IMAGE}:build-${COMMIT}" --format '{{json .Manifest}}' | jq -r '.digest')
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::${IMAGE}:build-${COMMIT} resolved to no usable digest: '${digest}'"
            exit 1
          fi
          echo "${IMAGE}:build-${COMMIT} -> ${digest}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Smoke test the build
        run: .github/scripts/smoke-test-image.sh "${{ needs.prepare.outputs.image }}@${{ steps.index.outputs.digest }}"

      # Only now does the build get the tags anything reads. The source is a single
      # image index with no annotations, which `imagetools create` copies verbatim, so
      # the new tags name the smoke-tested index digest rather than a new index.
      # (--prefer-index=false is for a single-MANIFEST source, where the default would
      # wrap it in a new index; an index source is copied either way.) The digest check
      # below proves it rather than trusting it.
      - name: Tag the tested build
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          DIGEST: ${{ steps.index.outputs.digest }}
          SHA_TAG: ${{ needs.prepare.outputs.sha_tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:${SHA_TAG}" \
            --tag "${IMAGE}:${VERSION}" \
            "${IMAGE}@${DIGEST}"
          for tag in "${SHA_TAG}" "${VERSION}"; do
            got=$(docker buildx imagetools inspect "${IMAGE}:${tag}" --format '{{json .Manifest}}' | jq -r '.digest')
            if [ "${got}" != "${DIGEST}" ]; then
              echo "::error::${IMAGE}:${tag} is ${got} after the retag, expected ${DIGEST}."
              exit 1
            fi
            echo "${IMAGE}:${tag} -> ${DIGEST}"
          done

      # Only the commit that is master's tip moves :dev, so a slower build of an older
      # commit never moves it backwards. If this commit is no longer the tip, the newer
      # commit's run moves it.
      - name: Move :dev
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          DIGEST: ${{ steps.index.outputs.digest }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          tip=$(git ls-remote origin refs/heads/master | cut -f1)
          if [ -z "${tip}" ]; then
            echo "::error::could not read master's tip from origin; leaving :dev alone."
            exit 1
          fi
          if [ "${tip}" != "${COMMIT}" ]; then
            echo "::notice::${COMMIT} is no longer master's tip (${tip}); leaving :dev alone."
            exit 0
          fi
          docker buildx imagetools create --tag "${IMAGE}:dev" "${IMAGE}@${DIGEST}"
          got=$(docker buildx imagetools inspect "${IMAGE}:dev" --format '{{json .Manifest}}' | jq -r '.digest')
          if [ "${got}" != "${DIGEST}" ]; then
            echo "::error::${IMAGE}:dev is ${got} after the retag, expected ${DIGEST}."
            exit 1
          fi
          echo "${IMAGE}:dev -> ${DIGEST}"
