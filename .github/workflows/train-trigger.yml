name: Train trigger

# Starts the merge train (train.yml) when an armed PR gains a head to test: auto-merge
# armed (`auto_merge_enabled` — auto-merge.yml arms the owner's PRs just after `opened`,
# and the release job arms the version-roll PR), or an armed PR pushed or reopened.
#
# pull_request_target, not pull_request, and nothing but a dispatch: pull_request_target
# runs MASTER's copy of this file, and the dispatch names `--ref master`, so a PR cannot
# change how the train is started or what it runs. This workflow must NEVER check out or
# execute PR code — pull_request_target runs with a token that can write to the repo even
# for a fork's PR.
#
# A dispatch while a train is running queues behind it (train.yml's concurrency group);
# several dispatches collapse into one pending run, which loses nothing, since each run
# takes the oldest untested PR when it starts.

on:
  pull_request_target:
    branches: [master]
    types: [opened, reopened, synchronize, auto_merge_enabled]

permissions:
  actions: write

jobs:
  dispatch:
    # An unarmed PR is not in the queue, so its events have nothing to start. (`opened`
    # fires before auto-merge.yml arms the PR; the `auto_merge_enabled` that follows is
    # what starts the train for it.)
    if: github.event.action == 'auto_merge_enabled' || github.event.pull_request.auto_merge != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch the merge train on master
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run train.yml --ref master --repo "$GITHUB_REPOSITORY"
