name: CI

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Determine which jobs need to run based on changed files
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - "src/**"
              - "assets/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - "Dockerfile"
              - "docker-compose.yml"
              - "migrations/**"
              - "rust-toolchain.toml"
              - ".github/workflows/ci.yml"
              - ".github/workflows/checks.yml"
              - ".github/scripts/rust-version.sh"

  # fmt/clippy/audit, unit tests and the live-Qdrant suite, as three parallel jobs —
  # the definition lives in checks.yml, shared with post-merge.yml and release.yml.
  # A PR builds no image: dev.yml builds one per master commit, and a release promotes
  # that build (release.yml). `pr-rebase` makes the jobs check the PR head rebased onto
  # current master, not the possibly-stale merge ref checkout would otherwise land on.
  checks:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/checks.yml
    with:
      pr-rebase: true
      pr-number: ${{ format('{0}', github.event.pull_request.number) }}
      pr-head-sha: ${{ github.event.pull_request.head.sha }}

  # Gate job for branch protection — set "ci-pass" as the required status check,
  # and only it: the individual jobs inside checks.yml report as `checks / lint`
  # etc., and naming those in the ruleset would couple it to checks.yml's layout.
  # Passes when `changes` succeeded AND `checks` succeeded or was skipped (doc-only
  # changes skip it, via the `changes` gate) — see the step body for why `changes`
  # is checked too. A failure of any job inside checks.yml (lint, test, or
  # qdrant-integration, which has been blocking since #133) makes `checks` fail.
  ci-pass:
    if: always()
    needs: [changes, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check result
        run: |
          ok=true
          # `changes` must be in `needs` and checked explicitly, not just relied
          # on transitively. `checks` is gated on `needs.changes.outputs.code`,
          # so if `changes` itself FAILS (a paths-filter outage, a checkout
          # failure) `checks` never runs and reports `skipped` — indistinguishable,
          # to the check below, from the legitimate doc-only case. Without this
          # clause the gate would print "CI passed (checks: skipped)" and exit 0
          # with zero verification having happened, and auto-merge would fire on
          # it. Requiring `changes` to have succeeded separates the two: a broken
          # `changes` fails the gate, while a successful `changes` reporting no
          # code changes still lets the skipped doc-only path pass.
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "changes: ${{ needs.changes.result }}"
            ok=false
          fi
          if [[ ! "${{ needs.checks.result }}" =~ ^(success|skipped)$ ]]; then
            echo "checks: ${{ needs.checks.result }}"
            ok=false
          fi
          if [[ "$ok" == "true" ]]; then
            echo "CI passed (checks: ${{ needs.checks.result }})"
          else
            echo "CI failed"
            exit 1
          fi
